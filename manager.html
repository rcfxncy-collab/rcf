function processReturn(billId){
  const b = state.bills.find(x=>x.id===billId);
  if(!b) return;
  let refundTotal = 0;
  const returnedItems = [];
  b.items.forEach((it,i)=>{
    const qty = Math.min(it.qty, Math.max(0, parseInt(document.getElementById('retQty-'+i).value)||0));
    if(qty>0){
      const lineRefund = it.price*qty*(1+it.gstRate/100);
      refundTotal += lineRefund;
      returnedItems.push({productId:it.productId, name:it.name, qty, refund:lineRefund});
      const p = state.products.find(x=>x.id===it.productId);
      if(p) p.stock += qty;
    }
  });
  if(!returnedItems.length){ alert('Select at least one item quantity to return.'); return; }
  state.returns.push({ id:uid(), originalBillId:b.id, date:new Date().toISOString(), items:returnedItems, refundTotal, processedBy: state.session.name });
  const cust = state.customers.find(c=>c.id===b.customerId);
  const dueReduced = b.due>0 ? Math.min(b.due, refundTotal) : 0;
  if(dueReduced>0){
    recordBillPayment(b, dueReduced, 'Adjusted against return');
  }
  const cashOwed = refundTotal - dueReduced;
  if(cust) recalcCustomerDue(cust.id);
  saveState(); closeModal(); render();
  let msg = `Return processed. Stock has been added back.\n\nTotal value of return: ${money(refundTotal)}`;
  if(dueReduced>0) msg += `\n${money(dueReduced)} adjusted against their due.`;
  if(cashOwed>0) msg += `\n${money(cashOwed)} to hand back to the customer in cash — the app doesn't process real refunds automatically.`;
  alert(msg);
}

async function liveSyncNow(manual){
  if(!state.liveSheetUrl || (!manual && !liveEnabled())) return;
  if(__live.busy){ __live.again = true; return; }
  __live.busy = true; liveSetStatus('Syncing...', null);
  try{
    const payload = JSON.stringify({ key: state.liveSheetKey||'', shop: state.shopName||'', sheets: liveBuildSnapshot() });
    let r = null;
    try{ r = await fetch(state.liveSheetUrl, { method:'POST', body: payload }); }catch(e){ r = null; }
    if(!r){
      // browser could not read the reply (CORS) - send anyway, we just cannot confirm
      await fetch(state.liveSheetUrl, { method:'POST', mode:'no-cors', body: payload });
      __live.last = Date.now(); liveSetStatus('Sent (could not confirm reply)', true);
    } else {
      let res; try{ res = await r.json(); }catch(e){ res = { ok:false, error:'Unexpected reply. Redeploy the script with access set to "Anyone".' }; }
      if(res && res.ok){ __live.last = Date.now(); liveSetStatus('Synced', true); }
      else liveSetStatus((res && res.error) || 'Sheet did not accept the data', false);
    }
  }catch(e){ liveSetStatus('Could not reach Google Sheet. Will retry on the next change.', false); }
  __live.busy = false;
  if(__live.again){ __live.again = false; liveSyncSchedule(); }
}

function openSetRecoveryPinModal(isChange){
  openModal(`
    <h3>${isChange?'Change':'Set Up'} Recovery PIN</h3>
    <div style="font-size:12.5px; color:var(--muted); margin-bottom:12px;">This PIN is used only to reset the Manager password from the login screen if it's forgotten. Keep it safe — anyone with it can reset your login.</div>
    ${isChange ? `<label>Current Recovery PIN</label><input type="password" id="curRecPin" inputmode="numeric" maxlength="6" style="margin-bottom:12px;">` : ''}
    <label>New Recovery PIN (4-6 digits)</label><input type="password" id="newRecPin" inputmode="numeric" maxlength="6" style="margin-bottom:12px;">
    <label>Confirm Recovery PIN</label><input type="password" id="confirmRecPin" inputmode="numeric" maxlength="6" style="margin-bottom:18px;">
    <div id="recPinErr" style="color:var(--red); font-size:12.5px; margin-bottom:10px;"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" style="flex:1;" onclick="saveRecoveryPin(${isChange})">Save</button>
    </div>`);
}
function saveRecoveryPin(isChange){
  const err = document.getElementById('recPinErr');
  if(isChange){
    const cur = document.getElementById('curRecPin').value;
    if(cur !== state.recoveryPin){ err.textContent = 'Current Recovery PIN is incorrect.'; return; }
  }
  const n1 = document.getElementById('newRecPin').value;
  const n2 = document.getElementById('confirmRecPin').value;
  if(!/^\d{4,6}$/.test(n1)){ err.textContent = 'PIN must be 4-6 digits.'; return; }
  if(n1 !== n2){ err.textContent = 'PINs do not match.'; return; }
  state.recoveryPin = n1;
  saveState(); closeModal(); render();
  showSuccessToast('Recovery PIN saved');
}
function deleteManagerAccount(id){
  if(confirm('Remove this manager account?')){ state.managers = state.managers.filter(m=>m.id!==id); saveState(); render(); }
}
function openSetPinModal(isChange){
  openModal(`
    <h3>${isChange?'Change':'Set Up'} PIN Lock</h3>
    ${isChange ? `<label>Current PIN</label><input type="password" id="curPin" inputmode="numeric" maxlength="4" style="margin-bottom:12px;">` : ''}
    <label>New 4-digit PIN</label><input type="password" id="newPin" inputmode="numeric" maxlength="4" style="margin-bottom:12px;">
    <label>Confirm PIN</label><input type="password" id="confirmPin" inputmode="numeric" maxlength="4" style="margin-bottom:18px;">
    <div id="pinSetErr" style="color:var(--red); font-size:12.5px; margin-bottom:10px;"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" style="flex:1;" onclick="saveNewPin(${isChange})">Save</button>
    </div>`);
}
function saveNewPin(isChange){
  const err = document.getElementById('pinSetErr');
  if(isChange){
    const cur = document.getElementById('curPin').value;
    if(cur !== state.appPin.code){ err.textContent = 'Current PIN is incorrect.'; return; }
  }
  const n1 = document.getElementById('newPin').value;
  const n2 = document.getElementById('confirmPin').value;
  if(!/^\d{4}$/.test(n1)){ err.textContent = 'PIN must be exactly 4 digits.'; return; }
  if(n1 !== n2){ err.textContent = 'PINs do not match.'; return; }
  state.appPin = { enabled:true, code:n1 };
  state.pinUnlocked = true;
  saveState(); closeModal(); render();
}
function backupData(){
  const {currentBill, tab, session, loginRole, loginError, navOpen, pinUnlocked, pendingOtp, settingsSubPage, ...persist} = state;
  const blob = new Blob([JSON.stringify(persist, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${(state.shopName||'shop').replace(/\s+/g,'_')}_backup_${todayStr()}.json`;
  a.click();
}
function restoreData(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let d;
    try{ d = JSON.parse(reader.result); }
    catch(e){ alert('Invalid backup file'); return; }
    if(!d.managerUsername){ alert('This file does not look like a valid backup'); return; }
    if(!confirm('This will REPLACE all current shop data (products, customers, bills, settings, staff logins) with the backup file. This cannot be undone. Continue?')) return;
    Object.assign(state, d, {currentBill:{customerId:null, items:[]}, tab:'settings', session: state.session, loginRole:'manager', loginError:''});
    saveState(); render();
    alert('Backup restored successfully');
  };
  reader.readAsText(file);
}
function attachSettingsHandlers(){
  document.querySelectorAll('.settings-row[data-sub]').forEach(row=>{
    row.addEventListener('click', ()=>{ state.settingsSubPage = row.dataset.sub; render(); });
  });
  const backBtn = document.getElementById('settingsBackBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.settingsSubPage = null; render(); });
  const fileInput = document.getElementById('stLogo');
  let newLogo = null;
  if(fileInput) fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ newLogo = reader.result; };
    reader.readAsDataURL(file);
  });
  const btn = document.getElementById('saveSettingsBtn');
  if(btn) btn.addEventListener('click', ()=>{
    state.shopName = document.getElementById('stName').value.trim() || state.shopName;
    state.address = document.getElementById('stAddress').value.trim();
    state.mobile = document.getElementById('stMobile').value.trim();
    if(newLogo) state.logo = newLogo;
    saveState(); render();
  });
  const backupBtn = document.getElementById('backupBtn');
  if(backupBtn) backupBtn.addEventListener('click', backupData);
  const restoreFile = document.getElementById('restoreFile');
  if(restoreFile) restoreFile.addEventListener('change', (e)=>{ const f = e.target.files[0]; if(f) restoreData(f); });
  const setupLogoutBtn = document.getElementById('setupLogoutBtn');
  if(setupLogoutBtn) setupLogoutBtn.addEventListener('click', ()=>{
    if(confirm('Log out of your account?')){ serverLogout(); state.session=null; state.loginRole='manager'; state.navOpen=false; render(); }
  });
  const tplSelect = document.getElementById('stPrintTemplate');
  if(tplSelect) tplSelect.addEventListener('change', ()=>{ state.printTemplate = tplSelect.value; saveState(); });
  const roundOffToggle = document.getElementById('roundOffToggle');
  if(roundOffToggle) roundOffToggle.addEventListener('change', ()=>{ state.roundOff = roundOffToggle.checked; saveState(); });
  const upiIdInput = document.getElementById('upiIdInput');
  if(upiIdInput) upiIdInput.addEventListener('change', ()=>{ state.upiId = upiIdInput.value.trim(); saveState(); });
  const saveIcBtn = document.getElementById('saveInvoiceCustomBtn');
  if(saveIcBtn) saveIcBtn.addEventListener('click', ()=>{
    const g = id=>document.getElementById(id);
    state.invoiceCustom = {
      titleColor: g('icTitleColor').value, bgColor: g('icBgColor').value,
      columns: {
        sr: document.querySelector('.ic-col[data-col="sr"]').checked,
        items: document.querySelector('.ic-col[data-col="items"]').checked,
        rate: document.querySelector('.ic-col[data-col="rate"]').checked,
        qty: document.querySelector('.ic-col[data-col="qty"]').checked,
        amt: document.querySelector('.ic-col[data-col="amt"]').checked
      },
      logoWatermark: g('icLogoWatermark').checked, paidIcon: g('icPaidIcon').checked,
      showDueDate: g('icDueDate').checked, showPaidDate: g('icPaidDate').checked, showValidityDate: g('icValidityDate').checked,
      dateFormat: g('icDateFormat').value,
      companyNameSize: g('icCompanyNameSize').value, contentSize: g('icContentSize').value,
      selfSignature: g('icSelfSig').checked, receiverSignature: g('icReceiverSig').checked,
      taxSummary: g('icTaxSummary').checked,
      showQrImage: g('icShowQr').checked, showTotalSave: g('icShowTotalSave').checked, paymentSummary: g('icPaymentSummary').checked, amountInWords: g('icAmountWords').checked,
      qtyDecimals: Math.max(0, Math.min(3, parseInt(g('icQtyDecimals').value)||0)), amtDecimals: Math.max(0, Math.min(3, parseInt(g('icAmtDecimals').value)||0))
    };
    saveState();
    showSuccessToast('Invoice customization saved');
  });
  const connectBtBtn = document.getElementById('connectBtPrinterBtn');
  if(connectBtBtn) connectBtBtn.addEventListener('click', connectBluetoothPrinter);
  const connectUsbBtn = document.getElementById('connectUsbPrinterBtn');
  if(connectUsbBtn) connectUsbBtn.addEventListener('click', connectUsbPrinter);
  const disconnectPrinterBtn = document.getElementById('disconnectPrinterBtn');
  if(disconnectPrinterBtn) disconnectPrinterBtn.addEventListener('click', disconnectPrinter);
  const themePresetSelect = document.getElementById('themePresetSelect');
  if(themePresetSelect) themePresetSelect.addEventListener('change', ()=>{ state.themePreset = themePresetSelect.value; saveState(); render(); });
  const setPinBtn = document.getElementById('setPinBtn');
  if(setPinBtn) setPinBtn.addEventListener('click', ()=>openSetPinModal(false));
  const changePinBtn = document.getElementById('changePinBtn');
  if(changePinBtn) changePinBtn.addEventListener('click', ()=>openSetPinModal(true));
  const disablePinBtn = document.getElementById('disablePinBtn');
  if(disablePinBtn) disablePinBtn.addEventListener('click', ()=>{
    if(confirm('Turn off PIN lock for this device?')){ state.appPin = {enabled:false, code:''}; saveState(); render(); }
  });
  const biometricToggle = document.getElementById('biometricToggle');
  if(biometricToggle) biometricToggle.addEventListener('change', ()=>{
    if(biometricToggle.checked && !(window.AndroidBridge && window.AndroidBridge.isBiometricAvailable && window.AndroidBridge.isBiometricAvailable())){
      alert('This device does not have fingerprint unlock set up, or you are not using the Nexora Android app.');
      biometricToggle.checked = false; return;
    }
    state.biometricEnabled = biometricToggle.checked; saveState();
  });
  const screenshotToggle = document.getElementById('screenshotToggle');
  if(screenshotToggle) screenshotToggle.addEventListener('change', ()=>{
    state.screenshotBlock = screenshotToggle.checked; saveState();
    if(window.AndroidBridge && window.AndroidBridge.setScreenshotBlocked) window.AndroidBridge.setScreenshotBlocked(state.screenshotBlock);
    else if(screenshotToggle.checked) alert('Screenshot prevention only works inside the Nexora Android app.');
  });
  const twoFactorToggle = document.getElementById('twoFactorToggle');
  if(twoFactorToggle) twoFactorToggle.addEventListener('change', ()=>{ state.twoFactorEnabled = twoFactorToggle.checked; saveState(); });
  const setRecPinBtn = document.getElementById('setRecoveryPinBtn');
  if(setRecPinBtn) setRecPinBtn.addEventListener('click', ()=>openSetRecoveryPinModal(false));
  const changeRecPinBtn = document.getElementById('changeRecoveryPinBtn');
  if(changeRecPinBtn) changeRecPinBtn.addEventListener('click', ()=>openSetRecoveryPinModal(true));
  const aboutPrivacyBtn = document.getElementById('aboutPrivacyBtn');
  if(aboutPrivacyBtn) aboutPrivacyBtn.addEventListener('click', showPrivacyPolicyModal);
  const aboutTermsBtn = document.getElementById('aboutTermsBtn');
  if(aboutTermsBtn) aboutTermsBtn.addEventListener('click', showTermsModal);
  const aboutSupportBtn = document.getElementById('aboutSupportBtn');
  if(aboutSupportBtn) aboutSupportBtn.addEventListener('click', showContactSupportModal);
  const updateUrlInput = document.getElementById('updateCheckUrl');
  if(updateUrlInput) updateUrlInput.addEventListener('change', ()=>{ state.updateCheckUrl = updateUrlInput.value.trim(); saveState(); });
  const checkUpdateBtn = document.getElementById('checkUpdateBtn');
  if(checkUpdateBtn) checkUpdateBtn.addEventListener('click', async ()=>{
    const msg = document.getElementById('updateCheckMsg');
    const url = (document.getElementById('updateCheckUrl').value||'').trim();
    if(!url){ msg.style.color='var(--red)'; msg.textContent='Enter a website URL first.'; return; }
    msg.style.color='var(--muted)'; msg.textContent='Checking...';
    try{
      const res = await fetch(url, {cache:'no-store'});
      const html = await res.text();
      const match = html.match(/APP_VERSION\s*=\s*["']v?([\d.]+)["']/);
      const remoteVersion = match ? 'v'+match[1] : null;
      if(!remoteVersion){ msg.style.color='var(--red)'; msg.textContent='Could not read a version number from that page.'; return; }
      if(remoteVersion !== APP_VERSION){ msg.style.color='var(--amber)'; msg.textContent = `A newer version (${remoteVersion}) is available online. This installed app is ${APP_VERSION}.`; }
      else { msg.style.color='var(--green)'; msg.textContent = `You're up to date (${APP_VERSION}).`; }
    }catch(e){ msg.style.color='var(--red)'; msg.textContent='Could not check — make sure you have internet and the URL is correct.'; }
  });
  const liveUrl = document.getElementById('liveUrl');
  if(liveUrl) liveUrl.addEventListener('change', ()=>{ state.liveSheetUrl = liveUrl.value.trim(); saveState(); });
  const liveToggle = document.getElementById('liveToggle');
  if(liveToggle) liveToggle.addEventListener('change', ()=>{
    state.liveSheetUrl = (liveUrl ? liveUrl.value.trim() : state.liveSheetUrl);
    if(liveToggle.checked && !state.liveSheetUrl){ alert('Paste the Apps Script Web App URL first.'); liveToggle.checked = false; return; }
    state.liveSheetEnabled = liveToggle.checked; saveState();
    if(liveToggle.checked) liveSyncNow(true);
  });
  const liveSyncBtn = document.getElementById('liveSyncBtn');
  if(liveSyncBtn) liveSyncBtn.addEventListener('click', ()=>{
    state.liveSheetUrl = (liveUrl ? liveUrl.value.trim() : state.liveSheetUrl);
    if(!state.liveSheetUrl){ alert('Paste the Apps Script Web App URL first.'); return; }
    saveState(); liveSyncNow(true);
  });
  const liveCopyBtn = document.getElementById('liveCopyBtn');
  if(liveCopyBtn) liveCopyBtn.addEventListener('click', ()=>{
    const ta = document.getElementById('liveScript');
    const done = ()=>showSuccessToast('Code copied');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, ()=>{ ta.select(); document.execCommand('copy'); done(); });
    else { ta.select(); document.execCommand('copy'); done(); }
  });
  const sheetsUrlInput = document.getElementById('sheetsUrl');
  if(sheetsUrlInput) sheetsUrlInput.addEventListener('change', ()=>{ state.sheetsWebhookUrl = sheetsUrlInput.value.trim(); saveState(); });
  const sheetsyncToggle = document.getElementById('sheetsyncToggle');
  if(sheetsyncToggle) sheetsyncToggle.addEventListener('change', ()=>{
    if(sheetsyncToggle.checked && !state.sheetsWebhookUrl){ alert('Enter the Apps Script Web App URL first.'); sheetsyncToggle.checked=false; return; }
    state.sheetsyncEnabled = sheetsyncToggle.checked; saveState();
  });
  const addManagerBtn = document.getElementById('addManagerBtn');
  if(addManagerBtn) addManagerBtn.addEventListener('click', ()=>openModal(`
    <h3>Add Manager Account</h3>
    <label>Name</label><input type="text" id="mMgrName" style="margin-bottom:12px;">
    <label>Username</label><input type="text" id="mMgrUser" style="margin-bottom:12px;">
    <label>Password</label><input type="text" id="mMgrPass" style="margin-bottom:18px;">
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" style="flex:1;" onclick="saveManagerAccount()">Create</button>
    </div>`));
  const enableNotifBtn = document.getElementById('enableNotifBtn');
  if(enableNotifBtn) enableNotifBtn.addEventListener('click', ()=>{
    if(!('Notification' in window)){ alert('Notifications are not supported on this device/browser.'); return; }
    Notification.requestPermission().then(perm=>{
      if(perm==='granted') alert('Notifications enabled. You\'ll see an alert here when a bill crosses your threshold, while the app is open.');
      else alert('Notification permission was not granted.');
    });
  });
  const bigSaleInput = document.getElementById('bigSaleThreshold');
  if(bigSaleInput) bigSaleInput.addEventListener('change', ()=>{ state.bigSaleThreshold = Math.max(0, parseFloat(bigSaleInput.value)||0); saveState(); });
  const fontSizeSelect = document.getElementById('fontSizeSelect');
  if(fontSizeSelect) fontSizeSelect.addEventListener('change', ()=>{ state.fontSize = fontSizeSelect.value; saveState(); applyFontSize(); });
}
function saveManagerAccount(){
  const name = document.getElementById('mMgrName').value.trim();
  const username = document.getElementById('mMgrUser').value.trim();
  const password = document.getElementById('mMgrPass').value;
  if(!name || !username || !password){ alert('Fill all fields'); return; }
  if(!isStrongPassword(password)){ alert(PASSWORD_HINT); return; }
  if(username===state.managerUsername || state.managers.some(m=>m.username===username) || state.cashiers.some(c=>c.username===username)){ alert('Username already taken'); return; }
  state.managers.push({id:uid(), name, username, password});
  saveState(); closeModal(); render();
  showSuccessToast('Manager account created');
}

// ============ MODAL ============
function openModal(html){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalBg'; bg.innerHTML=`<div class="modal">${html}</div>`; document.body.appendChild(bg); }
function closeModal(){ const m=document.getElementById('modalBg'); if(m) m.remove(); }

// ---- Swipe gestures: swipe from left edge to open nav drawer, swipe left to close ----
let __touchStartX = 0, __touchStartY = 0;
document.addEventListener('touchstart', (e)=>{ __touchStartX = e.touches[0].clientX; __touchStartY = e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', (e)=>{
  if(!state.session) return;
  const dx = e.changedTouches[0].clientX - __touchStartX;
  const dy = e.changedTouches[0].clientY - __touchStartY;
  if(Math.abs(dx)>70 && Math.abs(dy)<60){
    if(dx>0 && __touchStartX<40 && !state.navOpen){ state.navOpen=true; render(); }
    else if(dx<0 && state.navOpen){ state.navOpen=false; render(); }
  }
}, {passive:true});

// ---- Idle auto-logout ----
let __idleTimer = null;
const IDLE_LIMIT_MS = 10*60*1000;
function resetIdleTimer(){
  clearTimeout(__idleTimer);
  if(!state.session) return;
  __idleTimer = setTimeout(()=>{
    serverLogout(); state.session = null; state.loginRole='manager'; state.navOpen=false; render();
    alert('You have been logged out due to inactivity.');
  }, IDLE_LIMIT_MS);
}
document.addEventListener('click', resetIdleTimer);
document.addEventListener('keydown', resetIdleTimer);
document.addEventListener('touchstart', resetIdleTimer, {passive:true});

loadState();
</script>
