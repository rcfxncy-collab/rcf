<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NEXORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#16241C; --paper:#F3F6F4; --paper-shadow:#E8EFEA;
    --green:#1E8449; --green-dark:#0E3B25; --green-light:#22A05A; --gold:#E8963C; --gold-dark:#C97A28; --amber:#D98A1B; --red:#DC3545;
    --line:#E5ECE7; --muted:#7C8F83; --surface-dark:#0E2A1F; --surface-light:#F6F9F7; --card-bg:#ffffff;
    --purple:#7C5CFC; --blue:#3B82F6; --orange:#F5A623;
    --shadow-card:0 1px 2px rgba(16,42,28,0.04), 0 2px 10px rgba(16,42,28,0.06);
    --shadow-pop:0 8px 24px rgba(16,42,28,0.14);
    --radius-lg:18px; --radius-md:14px; --radius-sm:10px;
  }
  html.dark{
    --ink:#E7F2EB; --paper:#0A1913; --paper-shadow:#132A20;
    --line:#1F3A2C; --muted:#7FA08D; --card-bg:#122820;
    --shadow-card:0 1px 2px rgba(0,0,0,0.3), 0 2px 10px rgba(0,0,0,0.25);
  }
  html.dark .card, html.dark .receipt, html.dark .stat-card, html.dark .auth-card, html.dark .modal{ background:var(--card-bg); }
  html.dark input, html.dark select{ background:var(--card-bg); color:var(--ink); border-color:var(--line); }
  html.dark .item-search-results{ background:var(--card-bg); }
  html.dark .item-search-results div:hover{ background:var(--paper-shadow); }
  .theme-toggle{background:none; border:1px solid var(--line); border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:14px; color:var(--ink);}
  .theme-toggle:hover{background:var(--paper-shadow);}
  .version-tag{font-size:8px; color:#6b756e; letter-spacing:0.05em; margin-left:8px; flex-shrink:0;}
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{width:100%; height:100%; overflow-x:hidden;}
  body{font-family:'Inter',sans-serif; background:var(--surface-dark); color:var(--ink); -webkit-font-smoothing:antialiased;}
  #app{width:100%; min-height:100vh;}
  .app-shell{display:flex; flex-direction:column; width:100%; min-height:100vh; overflow-x:hidden;}
  .num{font-family:'JetBrains Mono',monospace;}

  /* Login / Setup */
  .auth-wrap{width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 20%, #17452F 0%, var(--surface-dark) 55%);}
  .auth-card{background:var(--paper); border-radius:var(--radius-lg); padding:36px 34px; width:380px; max-width:90vw; box-shadow:var(--shadow-pop);}
  .auth-logo{width:60px; height:60px; border-radius:16px; object-fit:cover; display:block; margin:0 auto 14px;}
  .auth-logo-placeholder{width:60px; height:60px; border-radius:16px; background:linear-gradient(135deg, var(--green-light), var(--green-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px; margin:0 auto 14px; box-shadow:var(--shadow-card);}
  .auth-shop{text-align:center; font-weight:800; font-size:20px; margin-bottom:2px; letter-spacing:-0.01em;}
  .auth-sub{text-align:center; font-size:12px; color:var(--muted); margin-bottom:24px; font-family:'Inter';}
  .role-tabs{display:flex; background:var(--paper-shadow); border-radius:12px; padding:4px; margin-bottom:20px;}
  .role-tab{flex:1; text-align:center; padding:9px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); transition:background 0.15s, color 0.15s;}
  .role-tab.active{background:var(--green); color:#fff; box-shadow:var(--shadow-card);}
  .auth-err{color:var(--red); font-size:12.5px; margin-top:10px; text-align:center;}

  /* ===== NEXORA Login (mockup) ===== */
  .login-shell{width:100%; min-height:100vh; display:flex; align-items:stretch; justify-content:center; background:#fff; padding:0;}
  .login-inner{display:flex; width:100%; max-width:none; box-shadow:none; border-radius:0; overflow:hidden; min-height:100vh;}
  .login-marketing{display:none;}
  .login-card-wrap{flex:1; background:#fff; padding:38px 8vw; display:flex; flex-direction:column; justify-content:center;}
  .login-card-wrap > *{width:100%; max-width:480px; margin-left:auto; margin-right:auto;}
  .brand-row{display:flex; align-items:center; gap:11px; margin-bottom:22px;}
  .brand-icon{width:44px; height:44px; border-radius:13px; background:linear-gradient(135deg,#22A05A,#0E3B25); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:22px; flex-shrink:0; box-shadow:0 4px 10px rgba(14,59,37,0.3);}
  .brand-word{font-size:21px; font-weight:800; letter-spacing:0.01em; color:var(--ink); line-height:1.1;}
  .brand-tag{font-size:10.5px; color:var(--muted); letter-spacing:0.04em; margin-top:1px;}
  .login-title{font-size:23px; font-weight:800; letter-spacing:-0.01em; margin-bottom:3px;}
  .login-subtitle{font-size:13px; color:var(--muted); margin-bottom:20px;}
  .input-icon-wrap{position:relative; margin-bottom:14px;}
  .input-icon-wrap input{padding-left:40px; padding-right:38px;}
  .input-icon-wrap .ic-left{position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:15px; opacity:0.6; pointer-events:none;}
  .input-icon-wrap .ic-right{position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:15px; opacity:0.6; cursor:pointer; background:none; border:none; padding:4px;}
  .remember-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; font-size:12.5px;}
  .remember-row label{display:flex; align-items:center; gap:7px; color:var(--ink); font-size:12.5px; text-transform:none; letter-spacing:0; font-weight:500; margin-bottom:0; cursor:pointer;}
  .remember-row input[type="checkbox"]{width:16px; height:16px; accent-color:var(--green); cursor:pointer;}
  .remember-row a{color:var(--green-dark); font-weight:600; cursor:pointer; text-decoration:none;}
  .remember-row a:hover{text-decoration:underline;}
  .or-divider{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--muted); font-size:11px; font-weight:600;}
  .or-divider::before, .or-divider::after{content:''; flex:1; height:1px; background:var(--line);}
  .fingerprint-btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; padding:12px; border-radius:12px; border:1.5px solid var(--line); background:#fff; cursor:pointer; font-weight:600; font-size:13.5px; color:var(--ink);}
  .fingerprint-btn:hover{background:var(--paper-shadow);}
  .new-pill{background:#DFF3E6; color:var(--green-dark); font-size:9.5px; font-weight:800; padding:2px 7px; border-radius:20px; letter-spacing:0.03em;}
  .trust-badges{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:20px;}
  .trust-badge{background:var(--paper-shadow); border-radius:11px; padding:9px 4px; text-align:center; font-size:10.5px; font-weight:700; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px;}
  .trust-badge .ic{font-size:15px;}
  .login-footer-link{text-align:center; font-size:12.5px; color:var(--muted); margin-top:20px;}
  .login-footer-link a{color:var(--green-dark); font-weight:700; cursor:pointer; text-decoration:none;}
  .login-footer-link a:hover{text-decoration:underline;}
  .login-mobile-banner{display:none;}
  @media (min-width:901px){
    .login-marketing{display:flex; flex-direction:column; justify-content:space-between; flex:1 1 46%; max-width:560px; flex-shrink:0; background:linear-gradient(165deg,#12583B 0%,#0A2E1F 100%); padding:5vh 6vw; color:#fff; position:relative; overflow:hidden;}
    .login-marketing::before{content:'🌿'; position:absolute; top:20px; right:24px; font-size:26px; opacity:0.4;}
    .lm-headline{font-size:26px; font-weight:800; line-height:1.2; margin:26px 0 8px;}
    .lm-headline .accent{color:#7CE7A6;}
    .lm-sub{font-size:12.5px; opacity:0.85; line-height:1.5; margin-bottom:22px;}
    .lm-feature{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
    .lm-feature-icon{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
    .lm-feature-title{font-size:13px; font-weight:700;}
    .lm-feature-sub{font-size:11px; opacity:0.7;}
    .lm-tagline{font-size:13px; font-style:italic; opacity:0.9; border-top:1px solid rgba(255,255,255,0.15); padding-top:16px; margin-top:6px;}
    .lm-footer{display:flex; gap:14px; font-size:10.5px; opacity:0.75; flex-wrap:wrap; margin-top:16px;}
  }
  @media (max-width:900px){
    .login-shell{padding:0; align-items:flex-start;}
    .login-inner{flex-direction:column; border-radius:0; box-shadow:none; max-width:100%; min-height:100vh;}
    .login-mobile-banner{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:linear-gradient(165deg,#12583B 0%,#0A2E1F 100%); padding:30px 20px 46px; color:#fff; position:relative; overflow:hidden;}
    .login-mobile-banner .lm-emoji{font-size:44px; margin-bottom:6px;}
    .login-mobile-banner .lm-slogan{font-size:11px; opacity:0.85; margin-top:4px; line-height:1.4;}
    .login-card-wrap{margin-top:-26px; border-radius:24px 24px 0 0; padding:28px 20px 40px; position:relative; z-index:2; box-shadow:0 -12px 26px rgba(0,0,0,0.06);}
    .login-title{font-size:20px;}
  }

  /* Top bar + drawer nav */
  .topnav-bar{width:100%; background:var(--surface-dark); color:var(--surface-light); display:flex; align-items:center; gap:12px; padding:12px 18px; flex-shrink:0;}
  .hamburger-btn{background:rgba(255,255,255,0.08); border:none; color:var(--surface-light); font-size:18px; cursor:pointer; padding:6px 9px; border-radius:9px; transition:transform 0.28s cubic-bezier(.34,1.56,.64,1), background 0.15s;}
  .hamburger-btn:hover{background:rgba(255,255,255,0.16);}
  .hamburger-btn.open{transform:rotate(90deg);}
  .nav-drawer-overlay{position:fixed; inset:0; background:rgba(6,20,13,0.55); z-index:99; opacity:0; pointer-events:none; transition:opacity 0.2s ease; backdrop-filter:blur(1px);}
  .nav-drawer-overlay.open{opacity:1; pointer-events:auto;}
  .nav-drawer{position:fixed; top:0; left:0; height:100vh; width:250px; background:linear-gradient(180deg, #0F2E20, #0A2016); color:var(--surface-light); z-index:100; transform:translateX(-100%); transition:transform 0.32s cubic-bezier(.34,1.56,.64,1); display:flex; flex-direction:column; padding:22px 14px; overflow-y:auto; box-shadow:6px 0 30px rgba(0,0,0,0.35);}
  .nav-drawer.open{transform:translateX(0);}
  .brand{font-family:'Inter',sans-serif; font-weight:800; font-size:13px; letter-spacing:0.02em; opacity:0.95;}
  .sidebar-logo{width:34px; height:34px; border-radius:9px; object-fit:cover; flex-shrink:0;}
  .nav-btn{width:auto; height:42px; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:8px; padding:0 14px; border-radius:11px; background:none; border:none; color:#A9C4B4; cursor:pointer; font-size:16px; flex-shrink:0; transition:background 0.15s, color 0.15s;}
  .nav-btn span{display:block; font-size:13px; font-family:'Inter'; letter-spacing:0.01em; font-weight:500;}
  .nav-btn.active{background:var(--green); color:#fff; box-shadow:0 4px 12px rgba(30,132,73,0.4);}
  .nav-btn.active span{font-weight:700;}
  .nav-btn:hover:not(.active){background:rgba(255,255,255,0.06); color:#fff;}
  .drawer-btn{width:100%; justify-content:flex-start; padding:11px 14px; border-radius:11px; font-size:15px; margin-bottom:3px;}
  .drawer-btn span{font-size:13.5px;}
  .logout-btn{width:100%; height:40px; display:flex; flex-direction:row; align-items:center; gap:8px; padding:0 14px; border-radius:11px; background:rgba(220,53,69,0.12); border:none; color:#F1A79E; cursor:pointer; font-size:15px; flex-shrink:0;}
  .logout-btn span{font-size:13px; font-weight:600;}
  .logout-btn:hover{background:rgba(220,53,69,0.22);}
  .drawer-footer-card{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.06); border-radius:12px; padding:10px 12px; margin-bottom:10px;}
  .nav-badge{background:var(--red); color:#fff; font-size:10px; font-weight:800; min-width:17px; height:17px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; padding:0 4px; margin-left:auto;}
  .cust-search-dropdown{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow-pop); max-height:230px; overflow-y:auto; z-index:30; margin-top:4px;}
  .cust-search-item{padding:9px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--line);}
  .cust-search-item:hover{background:var(--paper-shadow);}
  .cust-search-item:last-child{border-bottom:none;}

  /* Main */
  .main{flex:1; background:var(--paper); overflow-y:auto; height:auto; min-height:0;}
  .topbar{padding:22px 32px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; background:var(--paper); position:sticky; top:0; z-index:5;}
  .topbar h1{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .topbar .sub{font-size:12px; color:var(--muted); font-family:'Inter';}
  .content{padding:28px 32px 60px;}

  .bill-grid{display:grid; grid-template-columns:1fr 380px; gap:24px; align-items:start;}
  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; box-shadow:var(--shadow-card);}
  .field-row{display:flex; gap:10px; margin-bottom:14px;}
  input, select{font-family:'Inter'; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); width:100%;}
  input:focus, select:focus{outline:none; border-color:var(--green); box-shadow:0 0 0 3px rgba(30,132,73,0.15);}
  label{font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); font-weight:600; display:block; margin-bottom:5px;}
  .field{flex:1;}

  .item-search-results{border:1px solid var(--line); border-radius:8px; max-height:200px; overflow-y:auto; margin-top:4px;}
  .item-search-results div{padding:9px 12px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; border-bottom:1px solid var(--line);}
  .item-search-results div:last-child{border-bottom:none;}
  .item-search-results div:hover{background:var(--paper-shadow);}
  .item-search-results .stock-low{color:var(--red); font-size:11px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); padding-bottom:8px; border-bottom:1px solid var(--line); font-weight:700;}
  td{padding:10px 4px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .qty-input{width:52px; padding:5px 6px; text-align:center; border-radius:8px;}
  .del-row{background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; padding:2px 6px;}
  .del-row:hover{opacity:0.6;}
  .mini-btn{background:none; border:1px solid var(--line); border-radius:8px; width:26px; height:26px; cursor:pointer; font-size:14px; color:var(--ink);}
  .mini-btn:hover{background:var(--paper-shadow);}

  .receipt{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); position:sticky; top:100px; box-shadow:var(--shadow-card);}
  .receipt-head{padding:18px 20px; border-bottom:1.5px dashed var(--line); text-align:center;}
  .receipt-head img{width:40px; height:40px; border-radius:8px; object-fit:cover; margin:0 auto 6px;}
  .receipt-head .shop{font-weight:800; font-size:16px; letter-spacing:0.02em;}
  .receipt-head .tag{font-size:10.5px; color:var(--muted); font-family:'JetBrains Mono'; margin-top:2px;}
  .receipt-body{padding:16px 20px;}
  .receipt-line{display:flex; justify-content:space-between; font-size:13px; padding:4px 0; font-family:'JetBrains Mono';}
  .receipt-line.item-name{font-family:'Inter'; font-size:12.5px; color:var(--muted); padding-top:8px; padding-bottom:0;}
  .receipt-total-row{display:flex; justify-content:space-between; padding-top:10px; margin-top:10px; border-top:1.5px dashed var(--line); font-weight:700; font-size:16px; font-family:'JetBrains Mono'; color:var(--green-dark);}
  .empty-receipt{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 18px; border-radius:12px; border:none; cursor:pointer; font-family:'Inter'; font-weight:600; font-size:13.5px; transition:filter 0.15s, transform 0.1s, background 0.15s;}
  .btn:active{transform:scale(0.98);}
  .btn-green{background:var(--green); color:#fff; box-shadow:0 3px 10px rgba(30,132,73,0.28);}
  .btn-green:hover{background:var(--green-light);}
  .btn-outline{background:none; border:1.5px solid var(--line); color:var(--ink);}
  .btn-outline:hover{background:var(--paper-shadow);}
  .btn-block{width:100%; margin-top:10px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:9px;}

  .row-between{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
  .stat-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; box-shadow:var(--shadow-card);}
  .stat-card .label{font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:0.04em; font-weight:600;}
  .stat-card .val{font-family:'Inter'; font-size:23px; font-weight:800; margin-top:6px; letter-spacing:-0.01em;}
  .trend-badge{display:inline-block; margin-top:6px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--paper-shadow); color:var(--muted);}
  .trend-badge.up{background:#DFF3E6; color:var(--green-dark);}
  .trend-badge.down{background:#FBE4E1; color:var(--red);}
  .stat-card.warn .val{color:var(--red);}
  .stat-card.good .val{color:var(--green);}

  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; font-family:'Inter';}
  .pill.ok{background:#DFF3E6; color:var(--green-dark);}
  .pill.low{background:#FBE4E1; color:var(--red);}
  .pill.due{background:#FCF0D6; color:var(--amber);}
  .pill.paid{background:#DFF3E6; color:var(--green-dark);}

  /* ===== Dashboard v2 (mockup style) ===== */
  .dash-topbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .dash-greet{font-size:19px; font-weight:800; letter-spacing:-0.01em;}
  .dash-greet .crown{font-size:15px;}
  .dash-sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .dash-right{display:flex; align-items:center; gap:10px;}
  .date-pill{display:flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:7px 12px; font-size:11.5px; color:var(--ink); box-shadow:var(--shadow-card);}
  .date-pill .d1{font-weight:700;}
  .date-pill .d2{color:var(--muted); font-size:10.5px;}
  .icon-btn{position:relative; width:36px; height:36px; border-radius:11px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; box-shadow:var(--shadow-card);}
  .icon-btn:hover{background:var(--paper-shadow);}
  .icon-btn .badge-dot{position:absolute; top:-3px; right:-3px; background:var(--red); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid var(--paper);}
  .avatar-circle{width:36px; height:36px; border-radius:50%; background:var(--green-dark); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; cursor:pointer;}

  .qa-banner{background:linear-gradient(135deg, #0F4A32, #176B44); border-radius:var(--radius-lg); padding:20px 22px; color:#fff; position:relative; overflow:hidden; margin:18px 0;}
  .qa-banner::after{content:'🌿'; position:absolute; top:14px; right:18px; font-size:32px; opacity:0.35;}
  .qa-banner h3{font-size:17px; font-weight:800; margin-bottom:2px;}
  .qa-banner p{font-size:12px; opacity:0.85; margin-bottom:14px;}

  .activity-item:last-child::before{display:none;}
  @media (max-width:1050px){ .dash-grid-2{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:700px){ .kpi-grid{grid-template-columns:repeat(2,1fr); gap:10px;} .qa-shortcuts{grid-template-columns:repeat(2,1fr);} }
  /* Settings list rows (like a native app settings screen) */
  .settings-row{display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; transition:background 0.12s;}

  .settings-row-text{flex:1; min-width:0;}
  .settings-row-title{font-size:14px; font-weight:600; color:var(--ink);}
  .settings-row-subtitle{font-size:12px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .settings-row-chevron{color:var(--muted); font-size:18px; flex-shrink:0;}
  .settings-back{display:flex; align-items:center; gap:8px; margin-bottom:16px; cursor:pointer; font-weight:700; font-size:15px; color:var(--ink);}

  .status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle;}

  .modal-bg{position:fixed; inset:0; background:rgba(10,25,17,0.55); display:flex; align-items:center; justify-content:center; z-index:50; backdrop-filter:blur(1px);}
  .modal{background:#fff; border-radius:var(--radius-lg); padding:24px; width:380px; max-width:90vw; max-height:85vh; overflow-y:auto; box-shadow:var(--shadow-pop);}

  .empty-state{text-align:center; padding:50px 20px; color:var(--muted);}

  .logo-preview{width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--line); margin-bottom:10px;}

  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

  .table-wrap{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}

  /* POS-style billing layout */

  .product-tile .tile-img{width:100%; height:56px; border-radius:10px; background:var(--paper-shadow); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:6px; overflow:hidden;}
  .product-tile .tile-img img{width:100%; height:100%; object-fit:cover;}
  .product-tile .tile-name{font-size:12px; font-weight:600; margin-bottom:2px; line-height:1.25;}
  .product-tile .tile-price{font-size:11.5px; color:var(--green);}
  .product-tile.add-tile{display:flex; flex-direction:column; align-items:center; justify-content:center; border-style:dashed; color:var(--muted);}
  .product-tile.add-tile .tile-img{background:none; font-size:26px; color:var(--muted);}

  .splash-screen{position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, #0A1230 0%, #050914 70%); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.5s ease, visibility 0.5s ease; overflow:hidden;}
  .splash-screen.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .splash-wave{position:absolute; width:60vmax; height:60vmax; border-radius:44% 56% 60% 40% / 50% 45% 55% 50%; opacity:0.85; filter:blur(0.5px);}
  .splash-wave.tl{top:-30vmax; left:-28vmax; background:linear-gradient(135deg,#1D4ED8,#0A1E5C 70%);}
  .splash-wave.br{bottom:-32vmax; right:-30vmax; background:linear-gradient(315deg,#1D4ED8,#0A1E5C 70%);}
  .splash-logo-wrap{margin-bottom:20px; position:relative; z-index:2; filter:drop-shadow(0 10px 26px rgba(29,78,216,0.55));}
  .splash-logo-wrap svg{width:92px; height:92px; display:block;}
  .splash-title{position:relative; z-index:2; color:#fff; font-family:'Inter',sans-serif; font-weight:800; font-size:34px; letter-spacing:0.06em; display:flex; text-transform:uppercase;}
  .splash-title .x-accent{background:linear-gradient(180deg,#7DD3FC,#2563EB); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .splash-tagline{position:relative; z-index:2; color:rgba(226,232,255,0.7); font-family:'Inter',sans-serif; font-size:13px; letter-spacing:0.03em; margin-top:8px;}
  .splash-tagline .dot{margin:0 8px; opacity:0.6;}
  .splash-spinner-wrap{position:relative; z-index:2; margin-top:44px; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .splash-ring{width:38px; height:38px; border-radius:50%; border:3px solid rgba(56,189,248,0.18); border-top-color:#38BDF8; animation:splashRingSpin 0.9s linear infinite;}
  @keyframes splashRingSpin{ to{ transform:rotate(360deg); } }
  .splash-loading-text{color:rgba(226,232,255,0.75); font-family:'Inter',sans-serif; font-size:12px; letter-spacing:0.02em;}
  .splash-progress-track{position:relative; z-index:2; width:180px; height:4px; border-radius:4px; background:rgba(255,255,255,0.12); margin-top:14px; overflow:hidden;}
  .splash-progress-fill{height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#1D4ED8,#38BDF8); animation:splashProgress 5s cubic-bezier(.2,.6,.3,1) forwards;}
  @keyframes splashProgress{ from{ width:0%; } to{ width:100%; } }

  .success-toast{position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-20px); background:var(--card-bg); color:var(--ink); border:1px solid var(--line); border-left:4px solid var(--green); border-radius:10px; padding:12px 18px; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,0.18); z-index:10000; opacity:0; transition:opacity 0.25s ease, transform 0.25s ease; font-size:13.5px; font-weight:600;}
  .update-banner{background:#FCF0D6; color:#5C4108; font-size:12.5px; font-weight:600; padding:10px 20px; display:flex; align-items:center; gap:12px;}
  .update-banner button{background:rgba(0,0,0,0.15); border:none; color:inherit; padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;}
  .success-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .success-toast .toast-check{width:22px; height:22px; border-radius:50%; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; animation:toastPop 0.35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes toastPop{ 0%{transform:scale(0);} 70%{transform:scale(1.15);} 100%{transform:scale(1);} }
  @keyframes dotPulse{ 0%,80%,100%{opacity:0.25; transform:scale(0.8);} 40%{opacity:1; transform:scale(1.15);} }

  @media print{ body *{visibility:hidden;} #printArea, #printArea *{visibility:visible;} #printArea{position:absolute; top:0; left:0; width:300px;} }
  @media (max-width:900px){ .bill-grid{grid-template-columns:1fr;} .receipt{position:static;} .pos-grid{grid-template-columns:1fr;} .pos-right{position:static;} }

  /* ===== MOBILE ===== */
  @media (max-width:700px){
    html, body{overflow-x:hidden; width:100%;}

    .main{width:100%; height:auto; min-height:100vh;}
    .content{padding:16px 14px 24px;}
    .topbar{padding:14px 16px 12px; flex-wrap:wrap; gap:4px;}
    .topbar h1{font-size:18px;}
    .topbar .sub{font-size:10.5px;}

    .topnav-bar{padding:8px 12px;}
    .topnav-bar .brand{display:none;}
    .sidebar-logo{width:26px; height:26px;}
    .nav-drawer{width:200px;}

    .bill-grid{gap:14px;}
    .card{padding:14px;}
    .receipt{top:auto;}
    .pos-header{grid-template-columns:1fr 1fr;}
    .pos-bottom-bar{grid-template-columns:1fr;}
    .product-grid{grid-template-columns:1fr 1fr 1fr; max-height:none;}

    .stat-grid{grid-template-columns:repeat(2,1fr); gap:10px;}
    .stat-card{padding:12px 14px;}
    .stat-card .val{font-size:18px;}

    table{font-size:12px;}
    th, td{padding:7px 4px; white-space:nowrap;}

    .auth-wrap{padding:20px;}
    .auth-card{width:100%; padding:26px 20px;}
    .auth-shop{font-size:17px;}

    .row-between{flex-direction:column; align-items:stretch;}
    .row-between .btn{width:100%;}

    .modal{width:92vw; padding:20px;}

    .field-row{flex-direction:column; gap:0;}
    .version-tag{display:none;}
    .theme-toggle{width:30px; height:30px; font-size:12px;}
  }
</style>

<body>

<div id="splashScreen" class="splash-screen">
  <div class="splash-wave tl"></div>
  <div class="splash-wave br"></div>
  <div class="splash-logo-wrap">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="nGradA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7DD3FC"/>
          <stop offset="55%" stop-color="#2563EB"/>
          <stop offset="100%" stop-color="#1E3A8A"/>
        </linearGradient>
        <linearGradient id="nGradB" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#1E3A8A"/>
          <stop offset="100%" stop-color="#38BDF8"/>
        </linearGradient>
      </defs>
      <path d="M42 28 H82 V128 L42 172 Z" fill="url(#nGradA)"/>
      <path d="M42 28 L162 152 V108 L82 28 Z" fill="url(#nGradB)"/>
      <path d="M118 72 L158 30 V150 H118 Z" fill="url(#nGradA)"/>
    </svg>
  </div>
  <div class="splash-title" id="splashTitle">NE<span class="x-accent">X</span>ORA</div>
  <div class="splash-tagline">Smart Billing <span class="dot">•</span> Simple Business</div>
  <div class="splash-spinner-wrap">
    <div class="splash-ring"></div>
    <div class="splash-loading-text">Loading...</div>
    <div class="splash-progress-track"><div class="splash-progress-fill"></div></div>
  </div>
</div>

<div id="app"></div>
<div id="printArea" style="display:none;"></div>

<script>
const S = (typeof window !== 'undefined' && window.storage) ? window.storage : null;
let state = {
  shopName: "My Shop", logo: "", address: "", mobile: "",
  managerUsername: "", managerPassword: "", managerName: "",
  cashiers: [],
  products: [], customers: [], bills: [], expenses: [], heldBills: [], returns: [],
  currentBill: { customerId: null, items: [] },
  tab: "billing",
  session: null, // {role, username, name}
  loginRole: "manager", loginError: "",
  theme: "light", navOpen: false, printTemplate: "classic",
  appPin: { enabled:false, code:"" }, pinUnlocked: false,
  fontSize: "medium", managers: [], twoFactorEnabled: false, pendingOtp: null,
  bigSaleThreshold: 5000, lastSummarySentDate: "",
  loginAttempts: {}, sheetsWebhookUrl: "", sheetsyncEnabled: false, liveSheetUrl: "", liveSheetEnabled: false, liveSheetKey: "", updateCheckUrl: "",
  roundOff: false, upiId: "", themePreset: "emerald", biometricEnabled: false, screenshotBlock: false,
  purchaseOrders: [], wastageLog: [], reportsTrendRange: "7d", messages: [],
  printerConnection: { type: "none", deviceName: "" },
  invoiceCustom: {
    titleColor: "#16241C", bgColor: "#ffffff",
    columns: { sr:false, items:true, rate:true, qty:true, amt:true },
    logoWatermark: false, paidIcon: false,
    showDueDate: true, showPaidDate: true, showValidityDate: false, dateFormat: "dd-MM-yyyy",
    companyNameSize: "large", contentSize: "medium",
    selfSignature: true, receiverSignature: false,
    taxSummary: true,
    showQrImage: false, showTotalSave: true, paymentSummary: false, amountInWords: true,
    qtyDecimals: 2, amtDecimals: 2
  },
  cloudUserEmail: null
};
const APP_VERSION = "v7.1";
const LOCAL_KEY = "kadai-billing-data";
const DEFAULTS_INV = JSON.parse(JSON.stringify(state.invoiceCustom));
const DEFAULTS_PRN = JSON.parse(JSON.stringify(state.printerConnection));
let __ver = 0, __mainJson = '', __billJson = new Map(), __pushTimer = null, __pollTimer = null, __dirty = false, __saveSeq = 0;

async function api(path, opts){
  const r = await fetch(path, Object.assign({credentials:'same-origin', cache:'no-store', headers:{'Content-Type':'application/json'}}, opts||{}));
  let j = {}; try{ j = await r.json(); }catch(e){}
  j._status = r.status; return j;
}
function persistable(){
  const {currentBill, tab, session, loginRole, loginError, navOpen, pinUnlocked, pendingOtp, settingsSubPage, managerPassword, recoveryPin, cloudUserEmail, bills, ...persist} = state;
  return persist;
}
function mergeData(d){
  Object.assign(state, d);
  state.invoiceCustom = Object.assign({}, DEFAULTS_INV, d.invoiceCustom||{}, { columns: Object.assign({}, DEFAULTS_INV.columns, (d.invoiceCustom&&d.invoiceCustom.columns)||{}) });
  state.printerConnection = Object.assign({}, DEFAULTS_PRN, d.printerConnection||{});
}
async function loadState(){
  try{ const r = await api('/api/public'); if(r && r.shopName) state.shopName = r.shopName; }catch(e){}
  render();
  hideSplash();
}
function hideSplash(){
  const splash = document.getElementById('splashScreen');
  if(!splash) return;
  setTimeout(()=>{ splash.classList.add('hide'); }, 5000);
}
function saveState(){
  if(!state.session) return;
  __dirty = true; __saveSeq++;
  clearTimeout(__pushTimer);
  __pushTimer = setTimeout(pushState, 500);
}
function applyBills(list){
  const m = new Map(state.bills.map(b=>[b.id,b]));
  for(const x of list){
    if(x.deleted){ m.delete(x.id); __billJson.delete(x.id); }
    else { try{ const b = JSON.parse(x.json); m.set(b.id, b); __billJson.set(b.id, x.json); }catch(e){} }
  }
  state.bills = [...m.values()].sort((a,b)=> a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
}
async function pushState(){
  if(!state.session) return;
  const seq = __saveSeq;
  const mainJson = JSON.stringify(persistable());
  const mainChanged = mainJson !== __mainJson;
  const upserts = [], upJson = [], seen = new Set();
  for(const b of state.bills){
    seen.add(b.id);
    const j = JSON.stringify(b);
    if(__billJson.get(b.id) !== j){ upserts.push(b); upJson.push([b.id, j]); }
  }
  const del = [];
  for(const id of __billJson.keys()) if(!seen.has(id)) del.push(id);
  if(!mainChanged && !upserts.length && !del.length){ if(seq === __saveSeq) __dirty = false; return; }
  try{
    const CH = 500;
    for(let i = 0; i === 0 || i < upserts.length; i += CH){
      const first = (i === 0);
      const body = '{"data":' + (first && mainChanged ? mainJson : 'null') + ',"bills":' + JSON.stringify(upserts.slice(i, i+CH)) + ',"deleted":' + JSON.stringify(first ? del : []) + '}';
      const r = await api('/api/data', {method:'PUT', body});
      if(r._status === 401){ forceLogout('Session expired. Please log in again.'); return; }
      if(!r.ok){ showSuccessToast('⚠ ' + (r.error || 'Could not save to database')); refreshStorage(); setTimeout(saveState, 8000); return; }
      __ver = r.updatedAt;
      if(first){ if(mainChanged) __mainJson = mainJson; del.forEach(id=>__billJson.delete(id)); }
      upJson.slice(i, i+CH).forEach(([id,j])=>__billJson.set(id,j));
    }
    if(seq === __saveSeq) __dirty = false;
    liveSyncSchedule();
  }catch(e){ showSuccessToast('⚠ Offline - changes not saved yet'); setTimeout(saveState, 8000); }
}
function forceLogout(msg){
  state.session = null; state.loginError = msg || ''; clearInterval(__pollTimer); render();
}
function startPolling(){ clearInterval(__pollTimer); __pollTimer = setInterval(pollRemote, 15000); }
async function pollRemote(){
  if(!state.session || __dirty) return;
  try{
    const r = await api('/api/data?since='+__ver);

function recordBillPayment(bill, amount, note){
  if(amount<=0) return;
  const applied = Math.min(amount, bill.due||0);
  bill.due = Math.max(0, (bill.due||0) - applied);
  bill.paid = (bill.paid||0) + applied;
  if(!bill.paymentHistory) bill.paymentHistory = [];
  bill.paymentHistory.push({date:new Date().toISOString(), amount:applied, balanceAfter:bill.due, note:note||'Payment collected', by:(state.session&&state.session.name)||''});
}
function numberToWordsINR(num){
  num = Math.round(num||0);
  if(num===0) return 'ZERO';
  const ones = ['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
  const tens = ['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  function twoDigit(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)] + (n%10?' '+ones[n%10]:''); }
  function threeDigit(n){ if(n<100) return twoDigit(n); return ones[Math.floor(n/100)]+' HUNDRED'+(n%100?' '+twoDigit(n%100):''); }
  const crore = Math.floor(num/10000000); num %= 10000000;
  const lakh = Math.floor(num/100000); num %= 100000;
  const thousand = Math.floor(num/1000); num %= 1000;
  const hundred = num;
  let parts = [];
  if(crore) parts.push(threeDigit(crore)+' CRORE');
  if(lakh) parts.push(threeDigit(lakh)+' LAKH');
  if(thousand) parts.push(threeDigit(thousand)+' THOUSAND');
  if(hundred) parts.push(threeDigit(hundred));
  return parts.join(' ').trim();
}
function dateFmt(d, fmt){
  const dt = new Date(d);
  const dd = String(dt.getDate()).padStart(2,'0'), MM = String(dt.getMonth()+1).padStart(2,'0'), yyyy = dt.getFullYear();
  const f = fmt || 'dd-MM-yyyy';
  return f.replace('dd',dd).replace('MM',MM).replace('yyyy',yyyy);
}
function trendPct(current, previous){
  if(!previous){ return current>0 ? `<div class="trend-badge up">↑ New</div>` : ''; }
  const pct = Math.round(((current-previous)/previous)*100);
  if(pct===0) return `<div class="trend-badge">– 0%</div>`;
  return `<div class="trend-badge ${pct>0?'up':'down'}">${pct>0?'↑':'↓'} ${Math.abs(pct)}%</div>`;
}

// ---- Small SVG chart helpers (used by dashboard) ----
function sparklineSvg(values, color){
  const w=100,h=40,pad=4;
  const vals = values.length ? values : [0,0];
  const max = Math.max(...vals,1), min=Math.min(...vals,0);
  const range = (max-min)||1;
  const stepX = vals.length>1 ? (w-2*pad)/(vals.length-1) : 0;
  const pts = vals.map((v,i)=>[ (pad+i*stepX), (h-pad-((v-min)/range)*(h-2*pad)) ]);
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  const gid = 'sg'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:36px; display:block;">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.35"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function barChartSvg(labels, values){
  const w=340,h=180, padL=30, padB=22, padT=10, padR=4;
  const max = Math.max(...values,1);
  const niceMax = Math.max(2000, Math.ceil(max/2000)*2000);
  const steps=5, chartW=w-padL-padR, chartH=h-padT-padB, gap=chartW/values.length, barW=gap*0.5;
  let grid='', axis='';
  for(let i=0;i<=steps;i++){
    const val = niceMax - (niceMax/steps)*i, y = padT + (chartH/steps)*i;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    axis += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--muted)">${val>=1000?(val/1000)+'K':val}</text>`;
  }
  let bars='';
  values.forEach((v,i)=>{
    const bh = (v/niceMax)*chartH, x = padL+gap*i+(gap-barW)/2, y = padT+chartH-bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,2).toFixed(1)}" rx="4" fill="var(--green)"/>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="var(--muted)">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:170px;">${grid}${axis}${bars}</svg>`;
}
function donutChartSvg(segments){
  const size=140, r=52, cx=size/2, cy=size/2, sw=18, circ=2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+x.value,0)||1;
  let cumulative=0, circles='';
  segments.forEach(seg=>{
    const frac = seg.value/total, dash = circ*frac, offset = circ*(1-cumulative);
    circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(1)} ${(circ-dash).toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    cumulative += frac;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:100%; height:100%;">${circles}</svg>`;
}

function timeAgo(ts){

  const diff = Date.now()-ts;

    }
  });
  document.getElementById('liBtn').addEventListener('click', async ()=>{

    const remember = document.getElementById('liRemember').checked;

    catch(e){ r = {error:'Cannot reach the server. Check your internet.'}; }
    if(!r.ok){ state.loginError = r.error || 'Wrong username or password'; render(); return; }
    mergeData(r.data || {});
    state.bills = []; __billJson = new Map(); applyBills(r.bills || []);
    __ver = r.updatedAt || 0; __mainJson = JSON.stringify(persistable()); __dirty = false;
    if(window.AndroidBridge && window.AndroidBridge.setScreenshotBlocked && state.screenshotBlock){ try{ window.AndroidBridge.setScreenshotBlocked(true); }catch(e){} }
    startPolling();
    if(r.role === 'manager'){ refreshStorage(); clearInterval(__stTimer); __stTimer = setInterval(refreshStorage, 600000); }
    state.loginError = '';
    if(r.role === 'manager'){
      if(state.twoFactorEnabled){
        const code = String(Math.floor(100000+Math.random()*900000));
        state.pendingOtp = { code, username:user, name:r.name, expires:Date.now()+90000 };
        render();
      } else {
        state.session = {role:'manager', username:user, name:r.name}; state.tab = 'dashboard'; render();
      }
    } else {
      const c = state.cashiers.find(x=>x.username===user);
      if(c) c.lastActive = Date.now();
      state.session = {role:'cashier', username:user, name:r.name}; state.tab = 'billing';
      const needsTutorial = c && !c.tutorialSeen; if(needsTutorial) c.tutorialSeen = true;
      saveState(); render();

    }
  });
}

async function saveResetPassword(){
  const err = document.getElementById('fpErr2');

  const p2 = document.getElementById('fpConfirmPass').value;
  if(!isStrongPassword(p1)){ err.textContent = PASSWORD_HINT; return; }

// ============ BILLING ============
function billTotals(){
  let subtotal=0, gst=0, mrpTotal=0, qtyTotal=0;
  state.currentBill.items.forEach(it=>{
    const line = it.price*it.qty;
    subtotal += line;
    gst += line*(it.gstRate/100);
    mrpTotal += (it.mrp||it.price)*it.qty;
    qtyTotal += it.qty;
  });
  const discountPct = Math.min(100, Math.max(0, state.currentBill.discountPct||0));
  const preDiscountTotal = subtotal+gst;
  const discountAmt = preDiscountTotal * (discountPct/100);
  const additionalCharges = Math.max(0, Number(state.currentBill.additionalCharges)||0);
  const productDiscountTotal = Math.max(0, mrpTotal - subtotal);
  const totalDiscount = productDiscountTotal + discountAmt;
  const total = preDiscountTotal - discountAmt + additionalCharges;
  const roundedTotal = state.roundOff ? Math.round(total) : total;
  const roundOffAmt = roundedTotal - total;
  return {subtotal, gst, discountPct, discountAmt, additionalCharges, mrpTotal, qtyTotal, productDiscountTotal, totalDiscount, total:roundedTotal, rawTotal:total, roundOffAmt};
}
function getRecentProducts(){
  const seen = [];
  [...state.bills].reverse().forEach(b=>{
    b.items.forEach(it=>{ if(!seen.includes(it.productId)) seen.push(it.productId); });
  });
  return seen.slice(0,12).map(id=>state.products.find(p=>p.id===id)).filter(Boolean);
}

function addProductToBill(productId, variantName){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  if(p.variants && p.variants.length && !variantName){
    openModal(`
      <h3>Select Variant — ${p.name}</h3>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${p.variants.map(v=>`<button class="btn btn-outline btn-block" onclick="addProductToBill('${p.id}','${v.replace(/'/g,"\\'")}'); closeModal();">${v}</button>`).join('')}
      </div>`);
    return;
  }
  const displayName = variantName ? `${p.name} (${variantName})` : p.name;
  const existing = state.currentBill.items.find(it=>it.productId===p.id && (it.variantName||'')===(variantName||''));
  if(existing){ existing.qty += 1; }
  else { state.currentBill.items.push({productId:p.id, name:displayName, variantName:variantName||'', mrp:p.mrp||p.price, price:p.price, gstRate:p.gstRate, qty:1, hideQty:!!p.hideQty}); }

let __scanStream = null;
function openCameraScan(){
  if(!('BarcodeDetector' in window)){
    alert('Camera barcode scanning is not supported on this browser/device. Please use the search box or a barcode scanner instead.');
    return;
  }
  openModal(`
    <h3>Scan Barcode</h3>
    <video id="scanVideo" style="width:100%; border-radius:10px; background:#000;" playsinline autoplay muted></video>
    <div id="scanStatus" style="margin-top:10px; font-size:12.5px; color:var(--muted); text-align:center;">Point camera at a barcode</div>
    <button class="btn btn-outline btn-block" style="margin-top:14px;" onclick="closeCameraScan()">Cancel</button>
  `);
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream=>{
    __scanStream = stream;
    const video = document.getElementById('scanVideo');
    if(!video) { stream.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject = stream;
    const detector = new BarcodeDetector();
    const scanLoop = async ()=>{
      if(!__scanStream || !document.getElementById('scanVideo')) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length){
          const value = codes[0].rawValue;
          const p = state.products.find(x=>x.barcode && x.barcode===value);
          closeCameraScan();
          if(p){ addProductToBill(p.id); }
          else { alert('No product found for barcode: ' + value); }
          return;
        }
      }catch(e){}
      requestAnimationFrame(scanLoop);
    };
    requestAnimationFrame(scanLoop);
  }).catch(()=>{
    document.getElementById('scanStatus').textContent = 'Camera permission denied or unavailable.';
  });
}
function closeCameraScan(){
  if(__scanStream){ __scanStream.getTracks().forEach(t=>t.stop()); __scanStream = null; }
  closeModal();
}

function maybeNotifyBigSale(total, cust){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(total >= (state.bigSaleThreshold||Infinity)){

  }

function completeBill(){
  const t = billTotals();
  const paid = Math.min(parseFloat(document.getElementById('paidAmount').value)||0, 999999999);
  const due = Math.max(0, t.total - paid);
  for(const it of state.currentBill.items){
    const p = state.products.find(x=>x.id===it.productId);
    if(p && p.stock < it.qty){ if(!confirm(`${p.name} stock is only ${p.stock}, billing ${it.qty}. Continue anyway?`)) return; }
  }
  state.currentBill.items.forEach(it=>{ const p = state.products.find(x=>x.id===it.productId); if(p) p.stock = Math.max(0, p.stock - it.qty); });
  const cust = state.customers.find(c=>c.id===state.currentBill.customerId);
  maybeNotifyBigSale(t.total, cust);

  if(state.currentBill.editingBillId){
    const b = state.bills.find(x=>x.id===state.currentBill.editingBillId);
    if(b){
      const prevPaid = b.paid||0;
      b.invoiceCategory = state.currentBill.invoiceCategory||'';
      b.customerId = state.currentBill.customerId;
      b.customerName = cust?cust.name:'Walk-in';
      b.customerPhone = cust?cust.phone:'';
      b.items = state.currentBill.items;
      b.subtotal=t.subtotal; b.gst=t.gst; b.discountPct=t.discountPct; b.discountAmt=t.discountAmt;
      b.productDiscountTotal=t.productDiscountTotal; b.additionalCharges=t.additionalCharges;
      b.total=t.total; b.paid=paid; b.due=due; b.editedAt=new Date().toISOString();
      if(!b.paymentHistory) b.paymentHistory = [];
      if(paid !== prevPaid){
        b.paymentHistory.push({date:new Date().toISOString(), amount: paid-prevPaid, balanceAfter: due, note: paid>prevPaid ? 'Payment recorded via bill edit' : 'Bill edited (payment reduced)', by:(state.session&&state.session.name)||''});
      }
    }
    state.currentBill = {customerId:null, items:[]};
    if(cust) recalcCustomerDue(cust.id);
    saveState(); render();
    if(b) showBillCompleteModal(b.id);
    return;
  }

  const invNo = nextInvoiceNo(); state.lastInvoiceNo = invNo;
  const bill = { id:uid(), invoiceNumber: String(invNo).padStart(4,'0'), invoiceCategory: state.currentBill.invoiceCategory||'', notes: state.currentBill.notes||'', date:new Date().toISOString(), customerId:state.currentBill.customerId, customerName: cust?cust.name:'Walk-in', customerPhone: cust?cust.phone:'', items:state.currentBill.items, subtotal:t.subtotal, gst:t.gst, discountPct:t.discountPct, discountAmt:t.discountAmt, productDiscountTotal:t.productDiscountTotal, additionalCharges:t.additionalCharges, roundOffAmt:t.roundOffAmt, total:t.total, paid, due, cashier: state.session.name, paymentHistory: paid>0 ? [{date:new Date().toISOString(), amount:paid, balanceAfter:due, note:'Initial payment at billing', by:state.session.name}] : [] };
  state.bills.push(bill);
  state.currentBill = {customerId:null, items:[]};
  if(cust) recalcCustomerDue(cust.id);
  saveState(); render();
  showBillCompleteModal(bill.id);
  syncBillToSheets(bill);
}
function syncBillToSheets(bill){

  fetch(state.sheetsWebhookUrl, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      invoiceNumber: bill.invoiceNumber, date: bill.date, customerName: bill.customerName,
      cashier: bill.cashier, subtotal: bill.subtotal, gst: bill.gst, total: bill.total,

// ============ DIRECT PRINTER CONNECTION (Bluetooth / USB) ============
let __btDevice = null, __btCharacteristic = null, __usbDevice = null;
async function connectBluetoothPrinter(){
  if(!navigator.bluetooth){ alert('Web Bluetooth is not available in this browser. Use Chrome or Edge on Android or Desktop, over HTTPS (not a plain file:// page).'); return; }
  try{
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455']
    });
    __btDevice = device;
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();
    let writable = null;
    for(const service of services){
      const chars = await service.getCharacteristics();
      writable = chars.find(c=>c.properties.write || c.properties.writeWithoutResponse);
      if(writable) break;
    }
    if(!writable){ alert('Connected to '+(device.name||'the device')+', but no writable print channel was found. This printer may not support Web Bluetooth printing.'); return; }
    __btCharacteristic = writable;
    state.printerConnection = { type:'bluetooth', deviceName: device.name || 'Bluetooth Printer' };
    saveState(); render();
    showSuccessToast('Bluetooth printer connected');
  }catch(err){
    if(err && err.name!=='NotFoundError') alert('Bluetooth connection failed: ' + (err.message||err));
  }
}
async function connectUsbPrinter(){
  if(!navigator.usb){ alert('WebUSB is not available in this browser. Use Chrome or Edge on desktop/Android, over HTTPS (not a plain file:// page).'); return; }
  try{
    const device = await navigator.usb.requestDevice({ filters: [] });
    await device.open();
    if(device.configuration===null) await device.selectConfiguration(1);
    await device.claimInterface(0);
    __usbDevice = device;
    state.printerConnection = { type:'usb', deviceName: device.productName || 'USB Printer' };
    saveState(); render();
    showSuccessToast('USB printer connected');
  }catch(err){
    if(err && err.name!=='NotFoundError') alert('USB connection failed: ' + (err.message||err));
  }
}
function disconnectPrinter(){
  try{ if(__btDevice && __btDevice.gatt && __btDevice.gatt.connected) __btDevice.gatt.disconnect(); }catch(e){}
  try{ if(__usbDevice) __usbDevice.close(); }catch(e){}
  __btDevice = null; __btCharacteristic = null; __usbDevice = null;
  state.printerConnection = { type:'none', deviceName:'' };
  saveState(); render();
  showSuccessToast('Printer disconnected');
}
function buildEscPosReceipt(bill){
  const ic = state.invoiceCustom;
  const enc = new TextEncoder();
  const ESC = 0x1B, GS = 0x1D;
  let bytes = [];
  const push = arr => bytes.push(...arr);
  const text = s => bytes.push(...enc.encode(s));
  push([ESC,0x40]);
  push([ESC,0x61,0x01]);
  push([ESC,0x21,0x30]); text(state.shopName+'\n'); push([ESC,0x21,0x00]);
  if(state.address) text(state.address+'\n');
  if(state.mobile) text(state.mobile+'\n');
  text(dateFmt(bill.date, ic.dateFormat)+' '+new Date(bill.date).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+'\n');
  text('--------------------------------\n');
  push([ESC,0x61,0x00]);
  bill.items.forEach(it=>{
    const lineTotal=(it.price*it.qty*(1+it.gstRate/100)).toFixed(ic.amtDecimals);
    text(it.name+'\n');
    text(`  ${it.qty.toFixed(ic.qtyDecimals)} x ${it.price.toFixed(ic.amtDecimals)}`.padEnd(20)+lineTotal+'\n');
  });
  text('--------------------------------\n');
  if(ic.taxSummary){
    text(`Subtotal: Rs.${bill.subtotal.toFixed(ic.amtDecimals)}\n`);
    text(`GST: Rs.${bill.gst.toFixed(ic.amtDecimals)}\n`);
  }
  if(ic.showTotalSave && bill.discountAmt>0) text(`Discount: -Rs.${bill.discountAmt.toFixed(ic.amtDecimals)}\n`);
  push([ESC,0x21,0x10]); text(`TOTAL: Rs.${bill.total.toFixed(ic.amtDecimals)}\n`); push([ESC,0x21,0x00]);
  if(ic.amountInWords) text(`(${numberToWordsINR(bill.total)} RUPEES ONLY)\n`);
  text(`Paid: Rs.${bill.paid.toFixed(ic.amtDecimals)}\n`);
  if(bill.due>0) text(`Due: Rs.${bill.due.toFixed(ic.amtDecimals)}\n`);
  push([ESC,0x61,0x01]);
  text(bill.customerName+'\n');
  text('Thank you, visit again!\n\n\n');
  push([GS,0x56,0x42,0x00]);
  return new Uint8Array(bytes);
}
async function writeBtInChunks(characteristic, data){
  const chunkSize = 180;
  for(let i=0;i<data.length;i+=chunkSize){
    const chunk = data.slice(i,i+chunkSize);
    try{
      if(characteristic.properties.writeWithoutResponse) await characteristic.writeValueWithoutResponse(chunk);
      else await characteristic.writeValue(chunk);
    }catch(e){ console.log('Bluetooth write chunk failed', e); }
  }
}
async function printViaConnectedPrinter(billId){
  const bill = state.bills.find(x=>x.id===billId);
  if(!bill) return;
  if(state.printerConnection.type==='bluetooth'){
    if(!__btCharacteristic){ alert('Bluetooth printer needs to be reconnected (browsers require reconnecting after a page reload). Go to Settings → Billing & Printing → Pair Bluetooth.'); return; }
    await writeBtInChunks(__btCharacteristic, buildEscPosReceipt(bill));
    showSuccessToast('Sent to Bluetooth printer');
  } else if(state.printerConnection.type==='usb'){
    if(!__usbDevice){ alert('USB printer needs to be reconnected (browsers require reconnecting after a page reload). Go to Settings → Billing & Printing → Connect USB.'); return; }
    try{ await __usbDevice.transferOut(1, buildEscPosReceipt(bill)); showSuccessToast('Sent to USB printer'); }
    catch(err){ alert('USB print failed: '+(err.message||err)); }
  } else {
    alert('No printer connected. Go to Settings → Billing & Printing to pair one.');
  }
}

function downloadProductTemplate(){
  const headers = ["Item Name","Category","Description","MRP","Discount %","Tax % (GST)","Item Code","Barcode","HSN/SAC","Unit","Opening Stock","Reorder Qty","Variants"];
  const example = [
    {"Item Name":"Aashirvaad Atta 5kg","Category":"Grocery","Description":"Whole wheat flour","MRP":285,"Discount %":5,"Tax % (GST)":5,"Item Code":"001","Barcode":"","HSN/SAC":"1101","Unit":"pcs","Opening Stock":40,"Reorder Qty":10,"Variants":""},
    {"Item Name":"Colgate Toothpaste 100g","Category":"Grocery","Description":"","MRP":55,"Discount %":0,"Tax % (GST)":12,"Item Code":"002","Barcode":"","HSN/SAC":"3306","Unit":"pcs","Opening Stock":60,"Reorder Qty":20,"Variants":""},
    {"Item Name":"Men's Round Neck T-Shirt","Category":"Clothes","Description":"Cotton, mixed sizes","MRP":399,"Discount %":10,"Tax % (GST)":5,"Item Code":"003","Barcode":"","HSN/SAC":"6109","Unit":"pcs","Opening Stock":15,"Reorder Qty":5,"Variants":"Red-S, Red-M, Blue-L"}
  ];
  const ws = XLSX.utils.json_to_sheet(example, {header:headers});
  ws['!cols'] = [{wch:24},{wch:12},{wch:24},{wch:9},{wch:11},{wch:11},{wch:11},{wch:14},{wch:10},{wch:9},{wch:12},{wch:11},{wch:28}];

  XLSX.writeFile(wb, `product_import_template.xlsx`);

function __normKey(k){ return String(k||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function handleImportFileSelect(e){
  const file = e.target.files[0];
  const status = document.getElementById('importStatus');
  const previewWrap = document.getElementById('importPreviewWrap');
  const confirmBtn = document.getElementById('confirmImportBtn');
  __importedRows = [];
  confirmBtn.disabled = true; confirmBtn.textContent = 'Import 0 Products';
  previewWrap.innerHTML = '';
  if(!file) return;
  status.textContent = 'Reading file...';
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ status.style.color='var(--red)'; status.textContent = 'No rows found in the first sheet.'; return; }
      const fieldMap = {itemname:'name', name:'name', category:'category', description:'description', desc:'description',
        mrp:'mrp', discount:'discountPct', discountpct:'discountPct', tax:'gstRate', taxgst:'gstRate', gst:'gstRate', gstrate:'gstRate',
        itemcode:'itemCode', code:'itemCode', barcode:'barcode', hsnsac:'hsn', hsn:'hsn', unit:'unit',
        openingstock:'stock', stock:'stock', reorderqty:'reorderQty', reorder:'reorderQty', variants:'variants'};
      const parsed = []; const errors = [];
      rows.forEach((row, i)=>{
        const obj = {};
        Object.keys(row).forEach(k=>{ const mapped = fieldMap[__normKey(k)]; if(mapped) obj[mapped] = row[k]; });
        const name = String(obj.name||'').trim();
        if(!name) return; // skip fully blank rows silently
        const mrp = parseFloat(obj.mrp)||0;
        if(mrp<=0){ errors.push(`Row ${i+2}: "${name}" — missing/invalid MRP, skipped`); return; }
        const discountPct = parseFloat(obj.discountPct)||0;
        const gstRate = parseFloat(obj.gstRate)||0;
        const discAmt = mrp*(discountPct/100);
        const price = mrp - discAmt;
        const variants = String(obj.variants||'').split(',').map(v=>v.trim()).filter(Boolean);
        parsed.push({
          name, category: String(obj.category||'Other').trim() || 'Other', description: String(obj.description||'').trim(),
          barcode: String(obj.barcode||'').trim(), itemCode: String(obj.itemCode||'').trim(),
          hsn: String(obj.hsn||'').trim(), unit: String(obj.unit||'none').trim().toLowerCase() || 'none',
          hideQty:false, mrp, discountPct, price, gstRate,
          stock: parseInt(obj.stock)||0, reorderQty: parseInt(obj.reorderQty)||0, variants
        });
      });
      __importedRows = parsed;
      status.style.color = errors.length ? 'var(--amber)' : 'var(--muted)';

function handleCustImportFile(e){
  const file = e.target.files[0];
  const status = document.getElementById('cImportStatus');
  const prev = document.getElementById('cImportPreview');
  const btn = document.getElementById('cImportConfirm');
  __importedCust = []; btn.disabled = true; btn.textContent = 'Import 0 Customers'; prev.innerHTML = '';
  if(!file) return;
  status.style.color = 'var(--muted)'; status.textContent = 'Reading file...';
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const wb = XLSX.read(new Uint8Array(evt.target.result), {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      if(!rows.length){ status.style.color='var(--red)'; status.textContent='No rows found in the first sheet.'; return; }
      const map = {name:'name', customername:'name', customer:'name', phone:'phone', mobile:'phone', mobileno:'phone', mobilenumber:'phone', phoneno:'phone', phonenumber:'phone', address:'address', due:'due', dueamount:'due', pending:'due', balance:'due'};
      const parsed = [], errors = [];
      rows.forEach((row,i)=>{
        const o = {}; let hasDue = false;
        Object.keys(row).forEach(k=>{ const m = map[__normKey(k)]; if(m){ o[m] = row[k]; if(m==='due') hasDue = true; } });
        const name = String(o.name||'').trim();
        if(!name){ if(Object.values(row).some(v=>String(v).trim())) errors.push(`Row ${i+2}: missing Name, skipped`); return; }
        let phone = String(o.phone||'').trim();
        const digits = phone.replace(/\D/g,'');
        if(digits.length>=10) phone = digits.slice(-10);
        parsed.push({ name, phone, address:String(o.address||'').trim(), due: hasDue ? Math.max(0, parseFloat(o.due)||0) : null });
      });
      __importedCust = parsed;
      status.style.color = errors.length ? 'var(--amber)' : 'var(--muted)';
      status.textContent = `Found ${parsed.length} customer${parsed.length===1?'':'s'} in "${file.name}".` + (errors.length ? ` ${errors.length} row(s) skipped.` : '');
      if(parsed.length){
        prev.innerHTML = `<div class="table-wrap" style="max-height:220px; overflow:auto;"><table style="font-size:11.5px;">
          <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th>Due</th></tr></thead>
          <tbody>${parsed.slice(0,50).map(c=>`<tr><td>${c.name}</td><td class="num">${c.phone||'—'}</td><td>${c.address||'—'}</td><td class="num">${c.due==null?'—':c.due.toFixed(2)}</td></tr>`).join('')}</tbody>
        </table></div>${parsed.length>50?`<div style="font-size:11px; color:var(--muted); margin-top:6px;">Showing first 50 of ${parsed.length} rows.</div>`:''}
        ${errors.length?`<div style="font-size:11px; color:var(--amber); margin-top:8px;">${errors.slice(0,8).join('<br>')}</div>`:''}`;
      }
      btn.disabled = !parsed.length;
      btn.textContent = `Import ${parsed.length} Customer${parsed.length===1?'':'s'}`;
    }catch(err){
      status.style.color='var(--red)'; status.textContent='Could not read this file. Make sure it is a valid .xlsx/.csv exported from Excel.';
    }
  };
  reader.readAsArrayBuffer(file);
}

  if(state.session.role!=='manager') return;
  const c = state.customers.find(x=>x.id===id);
  openModal(`<h3>Collect Payment — ${c.name}</h3><label>Current due: ${money(c.dueAmount)}</label>

function savePayment(id){
  const amt = parseFloat(document.getElementById('mPay').value)||0;
  const cust = state.customers.find(x=>x.id===id);
  if(!cust || amt<=0) return;
  let remaining = amt;
  const dueBills = state.bills.filter(b=>b.customerId===id && (b.due||0)>0).sort((a,b)=>new Date(a.date)-new Date(b.date));
  for(const b of dueBills){
    if(remaining<=0) break;
    const applyAmt = Math.min(remaining, b.due);
    recordBillPayment(b, applyAmt, 'Payment collected from Customer page');
    remaining -= applyAmt;
  }
  recalcCustomerDue(id);
  saveState(); closeModal(); render();
  showSuccessToast('Payment collected');
}

    if(cur !== c.password){ msg.style.color='var(--red)'; msg.textContent='Current password is incorrect.'; return; }
    if(!isStrongPassword(n1)){ msg.style.color='var(--red)'; msg.textContent=PASSWORD_HINT; return; }
    if(n1 !== n2){ msg.style.color='var(--red)'; msg.textContent='New passwords do not match.'; return; }
    c.password = n1;
    saveState();
    msg.style.color='var(--green)'; msg.textContent='Password updated successfully.';
    document.getElementById('curPass').value=''; document.getElementById('newPass').value=''; document.getElementById('newPass2').value='';
  });
}

const wpSale = (p,d)=> Math.round(p*(1-(d||0)/100));
function renderWebProducts(){

  return `

      <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Discount</th><th>Sale Price</th><th></th></tr></thead>
      <tbody>${__wp.map(p=>`<tr>

        <td>${p.name.replace(/</g,'&lt;')}</td><td class="num">₹${p.price}</td><td>${p.discount||0}%</td><td class="num">₹${wpSale(p.price,p.discount)}</td>

function openWebProduct(id){
  const p = id ? __wp.find(x=>x.id===id) : null;
  __wpEditId = id||null; __wpImg = null;
  const esc = s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  openModal(`
    <h3>${p?'Edit':'Add'} Website Product</h3>
    <label>Product Image</label>
    <img id="wpPrev" ${p?`src="/api/web-products/${p.id}/image?v=${p.imgv||0}"`:'style="display:none;"'} style="width:100%;max-height:200px;object-fit:contain;border-radius:10px;margin-bottom:8px;background:#f1f3f6;">
    <input type="file" id="wpFile" accept="image/*" style="margin-bottom:12px;" onchange="wpPickImage(this)">
    <label>Product Name</label><input type="text" id="wpName" value="${esc(p&&p.name)}" style="margin-bottom:12px;">
    <label>Description</label><textarea id="wpDesc" rows="3" style="width:100%; font-family:'Inter'; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; resize:vertical; margin-bottom:12px;">${esc(p&&p.description)}</textarea>
    <div class="field-row">
      <div class="field"><label>Price (₹)</label><input type="number" id="wpPrice" min="0" value="${p?p.price:''}" oninput="wpCalc()"></div>
      <div class="field"><label>Discount (%)</label><input type="number" id="wpDisc" min="0" max="95" value="${p?(p.discount||0):0}" oninput="wpCalc()"></div>
    </div>
    <div id="wpCalc" class="sub" style="text-transform:none;margin-bottom:16px;"></div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" style="flex:1;" id="wpSaveBtn" onclick="saveWebProduct()">Upload</button>
    </div>`);
  wpCalc();
}
function wpCalc(){
  const p=parseFloat(document.getElementById('wpPrice').value)||0, d=parseFloat(document.getElementById('wpDisc').value)||0;
  document.getElementById('wpCalc').textContent = p ? `Website will show: ₹${wpSale(p,d)}  (strike ₹${p}${d?`, ${d}% OFF`:''})` : '';
}
function wpPickImage(inp){
  const f = inp.files[0]; if(!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = ()=>{
    const max = 900, k = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    __wpImg = c.toDataURL('image/jpeg', 0.8);
    const pv = document.getElementById('wpPrev'); pv.src = __wpImg; pv.style.display = 'block';
    URL.revokeObjectURL(url);
  };
  img.onerror = ()=>alert('Could not read this image');
  img.src = url;
}
async function saveWebProduct(){
  const body = { name:document.getElementById('wpName').value, description:document.getElementById('wpDesc').value,
    price:document.getElementById('wpPrice').value, discount:document.getElementById('wpDisc').value };
  if(__wpImg) body.image = __wpImg;
  if(!body.name.trim() || !(parseFloat(body.price)>0)){ alert('Enter product name and price'); return; }
  if(!__wpEditId && !__wpImg){ alert('Please choose a product image'); return; }
  const btn = document.getElementById('wpSaveBtn'); btn.disabled = true; btn.textContent = 'Uploading…';
  const r = await api(__wpEditId ? '/api/web-products/'+__wpEditId : '/api/web-products', {method: __wpEditId?'PUT':'POST', body: JSON.stringify(body)});
  if(!r.ok){ alert(r.error || 'Upload failed'); btn.disabled = false; btn.textContent = 'Upload'; return; }
  closeModal(); showSuccessToast('Product uploaded to website'); __wp = null; render();
}
async function deleteWebProduct(id){
  if(!confirm('Remove this product from the website?')) return;
  await api('/api/web-products/'+id, {method:'DELETE'}); __wp = null; render();
}

// ============ DASHBOARD (manager) ============
function renderDashboard(){
  const today = todayStr(); const month = monthStr();
  const todaysBills = state.bills.filter(b=>b.date.slice(0,10)===today);
  const monthBills = state.bills.filter(b=>b.date.slice(0,7)===month);
  const todaySales = todaysBills.reduce((s,b)=>s+b.total,0);
  const monthSales = monthBills.reduce((s,b)=>s+b.total,0);
  const totalDue = state.customers.reduce((s,c)=>s+(c.dueAmount||0),0);
  const lowStock = state.products.filter(p=>p.stock<=(p.reorderQty?Math.min(p.reorderQty,10):5)).sort((a,b)=>a.stock-b.stock);
  const hourNow = new Date().getHours();
  const showSummaryBanner = hourNow>=20 && state.lastSummarySentDate!==today && todaysBills.length>0;

  // ---- Last 7 days series (for sparklines + bar chart) ----
  const days = []; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const dayKeys = days.map(d=>d.toISOString().slice(0,10));
  const dayLabels = days.map(d=>d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}));
  const salesByDay = dayKeys.map(k=>state.bills.filter(b=>b.date.slice(0,10)===k).reduce((s,b)=>s+b.total,0));
  const billsByDay = dayKeys.map(k=>state.bills.filter(b=>b.date.slice(0,10)===k).length);
  const yesterdaySales = salesByDay[5];
  const salesTrendPct = yesterdaySales ? Math.round(((todaySales-yesterdaySales)/yesterdaySales)*100) : (todaySales>0?100:0);
  const yesterdayBillCount = billsByDay[5];
  const billsTrendPct = yesterdayBillCount ? Math.round(((todaysBills.length-yesterdayBillCount)/yesterdayBillCount)*100) : (todaysBills.length>0?100:0);
  const healthyStock = state.products.length ? Math.round(((state.products.length-lowStock.length)/state.products.length)*100) : 100;
  const custWithSalesThisMonth = new Set(monthBills.map(b=>b.customerId).filter(Boolean)).size;
  const custActivePct = state.customers.length ? Math.round((custWithSalesThisMonth/state.customers.length)*100) : 0;

  // ---- Sales by category (current month) ----
  const catColors = {Groceries:'#1E8449', Snacks:'#F5A623', Drinks:'#3B82F6', Others:'#7C5CFC'};
  const catTotals = {};
  monthBills.forEach(b=>(b.items||[]).forEach(it=>{
    const p = state.products.find(x=>x.id===it.productId);
    const cat = (p && p.category) ? p.category : 'Others';
    catTotals[cat] = (catTotals[cat]||0) + (it.price*it.qty);
  }));
  let catEntries = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  if(catEntries.length>4){ const rest = catEntries.slice(3).reduce((s,e)=>s+e[1],0); catEntries = catEntries.slice(0,3).concat([['Others', rest]]); }
  const palette = ['#1E8449','#F5A623','#3B82F6','#7C5CFC','#DC3545'];
  const catSegments = catEntries.map(([label,value],i)=>({label, value, color: catColors[label]||palette[i%palette.length]}));
  const catTotalVal = catSegments.reduce((s,x)=>s+x.value,0);

  // ---- Recent bills / activity ----
  const recentBills = [...state.bills].reverse().slice(0,5);
  const recentExpenses = [...state.expenses].slice(-5).reverse();
  const activityFeed = [
    ...recentBills.map(b=>({t:new Date(b.date).getTime(), icon:'🧾', title:'New bill created', sub:`${b.customerName||'Walk-in'} · ${money(b.total)}`, time:new Date(b.date).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})})),
    ...recentExpenses.map(e=>({t:new Date(e.date).getTime()||0, icon:'💸', title:'Expense added', sub:`${e.category||'Expense'} · ${money(e.amount)}`, time:e.date}))
  ].sort((a,b)=>b.t-a.t).slice(0,5);

  const greetHour = new Date().getHours();
  const greeting = greetHour<12 ? 'Good Morning' : greetHour<17 ? 'Good Afternoon' : 'Good Evening';
  const greetEmoji = greetHour<12 ? '☀️' : greetHour<17 ? '🌤️' : '🌙';
  const nowStr = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const nowTime = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});

  return `
  <div class="dash-topbar">
    <div>
      <div class="dash-greet">Welcome Back, ${state.session.name.split(' ')[0]} <span class="crown">👑</span></div>
      <div class="dash-sub">${greeting}! ${greetEmoji}</div>
    </div>
    <div class="dash-right">
      <div class="date-pill">📅 <span><span class="d1">${nowStr}</span><br><span class="d2">${nowTime}</span></span></div>
      <div class="icon-btn" title="Alerts">🔔${lowStock.length?`<span class="badge-dot">${lowStock.length}</span>`:''}</div>
      <div class="icon-btn" id="dashThemeToggle" title="Toggle theme">${state.theme==='dark'?'☀️':'🌙'}</div>
      <div class="avatar-circle" title="${state.session.name}">${state.session.name.charAt(0).toUpperCase()}</div>
    </div>
  </div>

  ${showSummaryBanner ? `
  <div class="card" style="margin-top:16px; background:#FCF3DC; border-color:var(--amber);">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div>🌙 It's evening — send today's sales summary?</div>
      <button class="btn btn-green btn-sm" id="sendDailySummaryBtn">📲 Send via WhatsApp</button>

function sendDailySummary(){
  const today = todayStr();
  const todaysBills = state.bills.filter(b=>b.date.slice(0,10)===today);
  const todaySales = todaysBills.reduce((s,b)=>s+b.total,0);
  const totalQty = todaysBills.reduce((s,b)=>s+b.items.reduce((a,it)=>a+it.qty,0),0);
  let text = `📊 *${state.shopName} — Daily Summary*\n${new Date().toLocaleDateString('en-IN')}\n\n`;
  text += `Bills: ${todaysBills.length}\nItems sold: ${totalQty}\nTotal sales: ${money(todaySales)}\n`;
  const num = state.mobile ? state.mobile.replace(/\D/g,'') : prompt('Enter WhatsApp number to send the summary to:');
  if(!num) return;
  const waNum = num.length===10 ? '91'+num : num;
  window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(text)}`, '_blank');
  state.lastSummarySentDate = today;
  saveState(); render();
}

function last7DaysData(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const total = state.bills.filter(b=>b.date.slice(0,10)===key).reduce((s,b)=>s+b.total,0);
    days.push({label: d.toLocaleDateString('en-IN',{weekday:'short'}), total});
  }
  return days;
}
function last4WeeksData(){
  const weeks = [];
  for(let i=3;i>=0;i--){
    const end = new Date(); end.setDate(end.getDate()-(i*7));
    const start = new Date(end); start.setDate(start.getDate()-6);
    const total = state.bills.filter(b=>{ const d=new Date(b.date); return d>=start && d<=end; }).reduce((s,b)=>s+b.total,0);
    weeks.push({label: `${start.getDate()}/${start.getMonth()+1}`, total});
  }
  return weeks;
}
function last6MonthsData(){
  const months = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setMonth(d.getMonth()-i);
    const key = d.toISOString().slice(0,7);
    const total = state.bills.filter(b=>b.date.slice(0,7)===key).reduce((s,b)=>s+b.total,0);
    months.push({label: d.toLocaleDateString('en-IN',{month:'short'}), total});
  }
  return months;
}
function renderChart(range){
  const data = range==='4w' ? last4WeeksData() : range==='6m' ? last6MonthsData() : last7DaysData();
  const max = Math.max(...data.map(d=>d.total), 1);
  const w=100/data.length;
  const bars = data.map((d,i)=>{
    const barH = Math.max((d.total/max)*120, d.total>0?4:0);
    const x = i*w + w*0.18;
    const bw = w*0.64;
    const y = 130-barH;
    return `<rect class="chart-bar" x="${x}%" y="${y}" width="${bw}%" height="${barH}" rx="3"></rect>
    <text class="chart-label" x="${x+bw/2}%" y="148" text-anchor="middle">${d.label}</text>`;
  }).join('');
  return `<svg viewBox="0 0 400 160" style="width:100%; height:150px;" preserveAspectRatio="none">${bars}</svg>`;
}
function renderDueAging(){
  const buckets = { '0-30':0, '31-60':0, '61-90':0, '90+':0 };
  state.customers.forEach(c=>{
    if(!(c.dueAmount>0)) return;
    const dueBills = state.bills.filter(b=>b.customerId===c.id && b.due>0);
    const oldest = dueBills.length ? Math.min(...dueBills.map(b=>new Date(b.date).getTime())) : Date.now();
    const days = (Date.now()-oldest)/(1000*60*60*24);
    if(days<=30) buckets['0-30'] += c.dueAmount;
    else if(days<=60) buckets['31-60'] += c.dueAmount;
    else if(days<=90) buckets['61-90'] += c.dueAmount;
    else buckets['90+'] += c.dueAmount;
  });
  const total = Object.values(buckets).reduce((a,b)=>a+b,0);
  if(total===0) return `<div class="empty-state"><div class="big">✅</div>No outstanding dues.</div>`;
  return `<div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
    <div class="stat-card"><div class="label">0-30 days</div><div class="val">${money(buckets['0-30'])}</div></div>
    <div class="stat-card warn"><div class="label">31-60 days</div><div class="val">${money(buckets['31-60'])}</div></div>
    <div class="stat-card warn"><div class="label">61-90 days</div><div class="val">${money(buckets['61-90'])}</div></div>
    <div class="stat-card" style="background:#F7E3DE;"><div class="label">90+ days</div><div class="val" style="color:var(--red);">${money(buckets['90+'])}</div></div>
  </div>`;
}

  const itemRows = [];
  arr.forEach(b=>(b.items||[]).forEach(it=>itemRows.push({ 'Invoice No': b.invoiceNumber, 'Date': d(b), 'Customer': b.customerName, 'Item': it.name, 'Variant': it.variantName||'', 'Qty': it.qty, 'Price': it.price, 'MRP': it.mrp||'', 'GST %': it.gstRate||0, 'Line Total': +(it.price*it.qty*(1+(it.gstRate||0)/100)).toFixed(2) })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(billRows), 'Bills');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(itemRows.length ? itemRows : [{}]), 'Items');
  const dates = arr.map(b=>b.date).sort();
  XLSX.writeFile(wb, `bills_backup_${dates[0].slice(0,10)}_to_${dates[dates.length-1].slice(0,10)}.xlsx`);

}

function bdConfirmDelete(){

  const ids = new Set(arr.map(b=>b.id)), custs = new Set();

    if(b.customerId) custs.add(b.customerId);
  });
  state.bills = state.bills.filter(b=>!ids.has(b.id));
  custs.forEach(id=>recalcCustomerDue(id));
  __bdSel.clear();
  saveState(); closeModal(); render(); refreshStorage();
  showSuccessToast(arr.length + ' bills deleted');

  openModal(`

    </div>`);
