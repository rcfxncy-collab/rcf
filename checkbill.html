<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Your Bill</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat','Segoe UI',Arial,sans-serif;background:#eceef0;color:#1a1a1a;min-height:100vh;padding:18px 12px 40px}
.wrap{max-width:794px;margin:0 auto}
.form{background:#fff;border-radius:16px;padding:24px 22px;box-shadow:0 6px 24px rgba(0,0,0,.08);margin-bottom:18px}
.form h1{font-size:20px;margin-bottom:4px}.form p.sub{font-size:13px;color:#666;margin-bottom:18px}
label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
input{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid #d4d7db;border-radius:10px;outline:none;font-family:inherit}
input:focus{border-color:#454646}
.cap{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cap button{border:1.5px solid #d4d7db;background:#fff;border-radius:10px;padding:10px 12px;font-size:16px;cursor:pointer}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#454646;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6}
.err{color:#c0392b;font-size:13px;margin-top:12px;min-height:18px}
/* invoice */
.inv{display:none;background:#fff;position:relative;overflow:hidden;padding:42px 36px 190px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:flex-start;font-size:14px;letter-spacing:1px}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:600;text-transform:uppercase;line-height:1.3}
.top img{height:44px;width:auto}
.title{font-size:clamp(54px,15vw,112px);font-weight:900;letter-spacing:-1px;line-height:1;margin:34px 0 28px;font-family:'Montserrat','Arial Black',Arial,sans-serif}
.date{font-size:15px;margin-bottom:26px}.date b{margin-right:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px;font-size:14px;line-height:1.6}
.cols b{display:block;font-size:15px;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#e6e6e8;font-weight:500;text-align:right;padding:14px 12px}
th:first-child,td:first-child{text-align:left}
td{padding:9px 12px;text-align:right;vertical-align:top}
td small{display:block;color:#777;font-size:11.5px}
.sum td{padding:5px 12px}
.sum tr.first td{border-top:2px solid #e6e6e8;padding-top:12px}
.sum tr.tot td{border-top:2px solid #e6e6e8;border-bottom:2px solid #e6e6e8;font-weight:800;padding:13px 12px;font-size:15px}
.meta{margin-top:26px;font-size:14px;line-height:1.9;padding-left:12px}.meta b{margin-right:6px}
.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;display:block}
.actions{display:none;gap:10px;margin-top:16px}
.actions button{flex:1;padding:13px;border-radius:10px;border:1.5px solid #454646;background:#fff;font-size:15px;font-weight:700;cursor:pointer}
.actions button.dark{background:#454646;color:#fff}
@media(max-width:560px){.inv{padding:26px 16px 130px}.cols{font-size:12.5px}table{font-size:12.5px}th,td{padding:8px 6px}.sum td{padding:4px 6px}.meta{font-size:12.5px;padding-left:6px}}
@media print{body{background:#fff;padding:0}.form,.actions{display:none!important}.inv{box-shadow:none;max-width:none}@page{size:A4;margin:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="form" id="form">
    <h1>Check Your Bill</h1>
    <p class="sub">Enter your mobile number and bill number to view your bill.</p>
    <label>Mobile Number</label><input id="mob" type="tel" inputmode="numeric" maxlength="14" placeholder="10 digit mobile number">
    <label>Bill Number</label><input id="bno" type="text" inputmode="numeric" placeholder="Example: 0012">
    <label>Captcha</label>
    <div class="cap"><div id="capImg"></div><button type="button" onclick="loadCaptcha()" title="New captcha">↻</button></div>
    <input id="capAns" type="text" autocomplete="off" autocapitalize="characters" placeholder="Type the letters above" style="text-transform:uppercase">
    <button class="go" id="go" onclick="lookup()">View Bill</button>
    <div class="err" id="err"></div>
  </div>

  <div class="inv" id="inv">
    <div class="top"><div class="brand"><img src="/public/logorcf.png" alt="" onerror="this.style.display='none'"><span id="shopName"></span></div><div id="invNo"></div></div>
    <div class="title">INVOICE</div>
    <div class="date"><b>Date:</b><span id="dt"></span></div>
    <div class="cols">
      <div><b>Billed to:</b><span id="billedTo"></span></div>
      <div><b>From:</b><span id="from"></span></div>
    </div>
    <table><thead><tr><th>Item</th><th>Quantity</th><th>Price</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table>
    <table class="sum"><tbody id="sum"></tbody></table>
    <div class="meta" id="meta"></div>
    <svg class="wave" viewBox="0 0 1131 330" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0 60 C120 40 330 40 520 130 L600 190 L0 330 Z" fill="#d0d1d3"/><path d="M60 330 C260 200 470 150 660 150 C860 150 1020 110 1131 0 L1131 330 Z" fill="#454646"/></svg>
  </div>
  <div class="actions" id="actions"><button class="dark" onclick="window.print()">Print / Save PDF</button><button onclick="again()">Check another bill</button></div>
</div>
<script>
let capToken = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
async function loadCaptcha(){
  $('capAns').value = '';
  try{ const r = await (await fetch('/api/captcha', {cache:'no-store'})).json(); capToken = r.token; $('capImg').innerHTML = r.svg; }
  catch(e){ $('capImg').textContent = 'Could not load'; }
}
async function lookup(){
  $('err').textContent = '';
  const mobile = $('mob').value.trim(), billNo = $('bno').value.trim(), captchaAnswer = $('capAns').value.trim();
  if(!mobile || !billNo || !captchaAnswer){ $('err').textContent = 'Fill in all the fields.'; return; }
  $('go').disabled = true; $('go').textContent = 'Please wait...';
  try{
    const res = await fetch('/api/bill-lookup', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({mobile, billNo, captchaToken: capToken, captchaAnswer})});
    const r = await res.json();
    if(!res.ok){ $('err').textContent = r.error || 'Something went wrong.'; loadCaptcha(); }
    else show(r);
  }catch(e){ $('err').textContent = 'Cannot reach the server. Check your internet.'; loadCaptcha(); }
  $('go').disabled = false; $('go').textContent = 'View Bill';
}
function show(r){
  const b = r.bill, s = r.shop;
  const d = new Date(b.date);
  $('shopName').textContent = s.name;
  $('invNo').textContent = 'NO. ' + String(b.invoiceNumber).padStart(6, '0');
  $('dt').textContent = String(d.getDate()).padStart(2,'0') + ' ' + d.toLocaleString('en-GB', {month:'long'}) + ', ' + d.getFullYear();
  $('billedTo').innerHTML = esc(b.customerName) + '<br>' + esc(b.customerPhone || '');
  $('from').innerHTML = esc(s.name) + (s.address ? '<br>' + esc(s.address) : '') + (s.mobile ? '<br>' + esc(s.mobile) : '');
  $('rows').innerHTML = b.items.map(i => '<tr><td>' + esc(i.name) + (i.variantName ? '<small>' + esc(i.variantName) + '</small>' : '') + '</td><td>' + i.qty + '</td><td>' + rs(i.price) + '</td><td>' + rs(i.price * i.qty) + '</td></tr>').join('');
  const row = (l, v, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td colspan="3" style="text-align:right">' + l + '</td><td>' + v + '</td></tr>';
  let sm = row('Subtotal', rs(b.subtotal), 'first') + row('GST', rs(b.gst));
  if(b.discountAmt > 0) sm += row('Discount', '-' + rs(b.discountAmt));
  if(b.additionalCharges > 0) sm += row('Extra charges', rs(b.additionalCharges));
  if(b.roundOffAmt) sm += row('Round off', rs(b.roundOffAmt));
  sm += row('Total', rs(b.total), 'tot') + row('Paid', rs(b.paid));
  if(b.due > 0) sm += row('<b>Balance due</b>', '<b>' + rs(b.due) + '</b>');
  $('sum').innerHTML = sm;
  $('meta').innerHTML = '<div><b>Status:</b>' + (b.due > 0 ? 'Payment pending' : 'Paid in full') + '</div>' + (b.notes ? '<div><b>Note:</b>' + esc(b.notes) + '</div>' : '') + '<div><b>Note:</b>Thank you for shopping with us!</div>';
  $('form').style.display = 'none'; $('inv').style.display = 'block'; $('actions').style.display = 'flex';
  window.scrollTo(0, 0);
}
function again(){ $('inv').style.display = 'none'; $('actions').style.display = 'none'; $('form').style.display = 'block'; $('bno').value = ''; loadCaptcha(); }
loadCaptcha();
</script>
</body>
</html>
